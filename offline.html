<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f32">
<title>Pathfinder Track · Sem conexão</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f6f4ec;color:#173f32;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}
main{width:min(440px,100%);background:#fff;border:1px solid #dfe6e2;border-radius:24px;box-shadow:0 16px 40px #173f3215;padding:34px 28px;text-align:center}
.symbol{width:72px;height:72px;display:grid;place-items:center;background:#173f32;color:#fff;font-size:30px;font-weight:900;letter-spacing:-.05em;border-radius:20px;margin:0 auto 22px}
h1{font-size:24px;line-height:1.15;margin:0 0 12px}p{color:#576b60;margin:0 0 23px}
button{border:0;border-radius:13px;background:#173f32;color:white;padding:13px 24px;font:inherit;font-weight:700;cursor:pointer;width:100%}
.note{font-size:12px;margin-top:18px;color:#68746e}a{color:#173f32}
</style>
</head><body><main><div class="symbol" aria-hidden="true">PT</div><h1>Sem conexão com a internet</h1>
<p>O Pathfinder Track está instalado, mas precisa de conexão para acessar dados, registrar presenças e salvar pontuações. Nenhuma alteração foi enviada.</p>
<button type="button" onclick="location.reload()">Tentar novamente</button>
<p class="note">Por segurança, os dados de Desbravadores não são armazenados no cache offline.</p></main></body></html>
