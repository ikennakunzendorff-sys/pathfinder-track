<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173f32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pathfinder Track" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  <title>Pathfinder Track</title>
  <style>
:root {
  --forest-950: #102d25;
  --forest-900: #173f32;
  --forest-800: #1f5743;
  --forest-700: #2c6d55;
  --forest-100: #e9f3ee;
  --cream: #f6f4ec;
  --paper: #ffffff;
  --ink: #17211c;
  --muted: #68746e;
  --line: #dfe6e2;
  --amber: #d7922d;
  --amber-soft: #fff1d8;
  --red: #b64a42;
  --red-soft: #fbe9e7;
  --shadow: 0 16px 40px rgba(23, 63, 50, .10);
  --radius-xl: 26px;
  --radius-lg: 20px;
  --radius-md: 14px;
}

* { box-sizing: border-box; }
html { background: var(--cream); }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    radial-gradient(circle at 100% 0%, rgba(44,109,85,.10), transparent 32rem),
    var(--cream);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button { cursor: pointer; }

.shell { min-height: 100vh; }

.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-weight: 800;
  letter-spacing: -.03em;
}
.brand-mark {
  width: 40px; height: 40px;
  border-radius: 14px;
  display: grid; place-items: center;
  background: var(--forest-900);
  color: white;
  box-shadow: 0 10px 24px rgba(23,63,50,.22);
}
.brand-mark svg { width: 22px; height: 22px; }
.brand-title { font-size: 18px; }
.brand-title span { color: var(--forest-700); }

.login-page {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.08fr .92fr;
}
.hero {
  padding: 48px clamp(28px, 6vw, 82px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: white;
  background:
    linear-gradient(155deg, rgba(16,45,37,.96), rgba(31,87,67,.94)),
    radial-gradient(circle at 20% 20%, #2c6d55, #102d25);
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  width: 420px; height: 420px;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 50%;
  right: -160px; bottom: -170px;
  box-shadow: 0 0 0 55px rgba(255,255,255,.035), 0 0 0 110px rgba(255,255,255,.025);
}
.hero .brand-mark { background: rgba(255,255,255,.14); box-shadow: none; }
.hero .brand-title span { color: #b9dec8; }
.hero-copy { max-width: 650px; padding: 72px 0 40px; position: relative; z-index: 1; }
.eyebrow { text-transform: uppercase; letter-spacing: .13em; font-weight: 800; font-size: 12px; color: #b9dec8; }
.hero h1 { font-size: clamp(42px, 6vw, 78px); line-height: .98; margin: 18px 0 22px; letter-spacing: -.055em; }
.hero p { max-width: 560px; font-size: clamp(17px, 2vw, 21px); line-height: 1.6; color: rgba(255,255,255,.76); }
.hero-pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.hero-pill { border: 1px solid rgba(255,255,255,.16); padding: 10px 13px; border-radius: 999px; font-size: 13px; color: rgba(255,255,255,.86); background: rgba(255,255,255,.06); backdrop-filter: blur(8px); }
.hero-foot { position: relative; z-index: 1; color: rgba(255,255,255,.54); font-size: 12px; }

.login-wrap { display: grid; place-items: center; padding: 30px; }
.login-card { width: min(430px, 100%); background: rgba(255,255,255,.92); border: 1px solid rgba(255,255,255,.75); border-radius: 30px; box-shadow: var(--shadow); padding: 34px; backdrop-filter: blur(14px); }
.login-card h2 { margin: 8px 0 8px; font-size: 30px; letter-spacing: -.04em; }
.login-card > p { margin: 0 0 26px; color: var(--muted); line-height: 1.55; }
.field { display: grid; gap: 8px; margin: 14px 0; }
.field label { font-weight: 750; font-size: 13px; }
.field input { width: 100%; border: 1px solid var(--line); border-radius: 14px; background: white; padding: 14px 15px; outline: none; transition: .2s; }
.field input:focus { border-color: var(--forest-700); box-shadow: 0 0 0 4px rgba(44,109,85,.10); }
.btn { border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 800; transition: transform .12s, opacity .2s, box-shadow .2s; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { width: 100%; color: white; background: var(--forest-900); box-shadow: 0 10px 22px rgba(23,63,50,.18); }
.btn-secondary { width: 100%; margin-top: 10px; color: var(--forest-900); background: var(--forest-100); }
.btn-ghost { background: transparent; color: var(--forest-900); border: 1px solid var(--line); }
.form-message { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--red); }
.login-note { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.5; }

.app-layout { min-height: 100vh; display: grid; grid-template-columns: 248px 1fr; }
.sidebar { background: var(--forest-950); color: white; padding: 26px 20px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.sidebar .brand { padding: 0 8px 22px; }
.sidebar .brand-mark { background: rgba(255,255,255,.10); box-shadow: none; }
.sidebar .brand-title span { color: #acd7bc; }
.nav { display: grid; gap: 7px; margin-top: 16px; }
.nav button { color: rgba(255,255,255,.70); background: transparent; border: 0; text-align: left; padding: 12px 13px; border-radius: 12px; font-weight: 650; display: flex; gap: 10px; align-items: center; text-transform:capitalize; }
.nav button.active, .nav button:hover { background: rgba(255,255,255,.09); color: white; }
.sidebar-spacer { flex: 1; }
.profile-mini { border-top: 1px solid rgba(255,255,255,.10); padding: 18px 8px 0; display: flex; gap: 10px; align-items: center; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #b9dec8; color: var(--forest-950); display: grid; place-items: center; font-weight: 900; }
.profile-mini strong { display: block; font-size: 13px; }
.profile-mini small { color: rgba(255,255,255,.55); }

.main { padding: 34px clamp(22px, 5vw, 58px) 60px; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
.topbar h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.045em; }
.topbar p { margin: 7px 0 0; color: var(--muted); }
.top-actions { display: flex; gap: 10px; align-items:center; }
.unit-picker { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; font-weight:750; }
.unit-select { border:1px solid var(--line); border-radius:12px; background:white; color:var(--ink); padding:10px 12px; min-width:190px; outline:none; }
.unit-select:focus { border-color:var(--forest-700); box-shadow:0 0 0 3px rgba(44,109,85,.10); }
.mobile-unit-picker { display:none; margin:-12px 0 18px; }
.mobile-staff-actions { display:none; margin:-12px 0 18px; }
.mobile-staff-actions .btn { width:100%; }
.mobile-meeting-actions { display:none; margin:-8px 0 18px; }
.mobile-meeting-actions .btn { width:100%; }

.pt-language-control{
  display:flex;
  align-items:center;
  gap:8px;
  margin:10px 0;
}
.pt-language-control span{font-size:15px}
.pt-language-control select{
  min-width:110px;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface);
  color:var(--text);
  font:inherit;
  font-size:13px;
  font-weight:700;
}
.sidebar .pt-language-control{
  width:100%;
  margin:16px 0 14px;
  padding:8px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;
  background:rgba(255,255,255,.06);
}
.sidebar .pt-language-control span{font-size:18px}
.sidebar .pt-language-control select{
  width:100%;
  background:#fff;
  color:#173f32;
  border-color:rgba(255,255,255,.32);
}
.mobile-top .pt-language-control{margin:0}
.mobile-top .pt-language-control select{min-width:86px;padding:7px 8px;font-size:12px}
.login-card .pt-language-control{justify-content:flex-end;margin:0 0 14px}
@media (max-width:760px){
  .sidebar .pt-language-control{display:none}
}

.mobile-unit-picker .unit-picker { width:100%; }
.mobile-unit-picker .unit-select { flex:1; min-width:0; }

.grid { display: grid; gap: 18px; }
.stats { grid-template-columns: repeat(4, minmax(0,1fr)); }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; box-shadow: 0 8px 26px rgba(23,63,50,.045); }
.stat .label { color: var(--muted); font-size: 13px; font-weight: 700; }
.stat .value { font-size: 31px; font-weight: 900; letter-spacing: -.04em; margin: 10px 0 5px; }
.stat .meta { color: var(--forest-700); font-size: 12px; font-weight: 750; }

.content-grid { grid-template-columns: 1.25fr .75fr; margin-top: 18px; align-items: start; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-xl); box-shadow: 0 8px 30px rgba(23,63,50,.05); overflow: hidden; }
.card-head { padding: 22px 22px 16px; display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.card-head h3 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
.card-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
.card-body { padding: 0 22px 22px; }
.next-meeting { padding: 22px; background: linear-gradient(135deg, var(--forest-900), var(--forest-700)); color: white; }
.next-meeting .eyebrow { color: #c9e7d5; }
.next-meeting h2 { margin: 8px 0 6px; font-size: 27px; letter-spacing: -.035em; }
.next-meeting p { margin: 0; color: rgba(255,255,255,.70); }
.meeting-action { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-top:22px; }
.meeting-action .btn { background:white; color:var(--forest-900); }
.score-chip { padding: 9px 11px; border-radius: 999px; background: rgba(255,255,255,.10); font-size: 12px; font-weight: 750; }

.member-list { display: grid; gap: 10px; }
.member-row { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.member-avatar { width: 42px; height: 42px; border-radius: 14px; background: var(--forest-100); color: var(--forest-800); display: grid; place-items: center; font-weight: 900; }
.member-row strong { display: block; font-size: 14px; }
.member-row small { display: block; color: var(--muted); margin-top: 3px; }
.points { font-size: 14px; font-weight: 900; color: var(--forest-800); }

.progress-block { margin: 2px 0 18px; }
.progress-label { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:13px; margin-bottom:8px; }
.progress { height: 9px; border-radius: 999px; background: #edf0ee; overflow:hidden; }
.progress > span { display:block; height:100%; border-radius:inherit; background:var(--forest-700); }

.meeting-page { max-width: 980px; }
.meeting-tools { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.meeting-create-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.meeting-create-grid .full { grid-column:1/-1; }
.meeting-type-cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.meeting-type-card { border:1px solid var(--line); border-radius:15px; padding:12px; background:#fafbf9; }
.meeting-type-card strong { display:block; font-size:13px; }
.meeting-type-card small { display:block; color:var(--muted); margin-top:4px; line-height:1.4; }
.special-points-grid { display:grid; gap:8px; }
.special-points-row { display:grid; grid-template-columns:minmax(0,1fr) 110px; gap:10px; align-items:center; border:1px solid var(--line); border-radius:14px; padding:10px 12px; background:#fafbf9; }
.special-points-row strong { font-size:13px; }
.special-points-input { text-align:right; }
.special-event-card { border:1px solid #ead5aa; background:var(--amber-soft); border-radius:22px; padding:20px; margin-top:14px; }
.special-event-badge { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:7px 10px; background:#fff4d9; color:#7d5b19; font-size:11px; font-weight:850; }
.special-event-points { font-size:42px; font-weight:950; letter-spacing:-.04em; color:var(--forest-900); margin:12px 0 3px; }
.special-event-actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
.special-score-note { display:inline-flex; align-items:center; gap:5px; color:#8b681e; font-size:11px; font-weight:800; margin-left:7px; }
@media (max-width:560px){
  .meeting-create-grid,.meeting-type-cards { grid-template-columns:1fr; }
  .meeting-create-grid .full { grid-column:auto; }
  .special-points-row { grid-template-columns:minmax(0,1fr) 92px; }
  .special-event-actions .btn { width:100%; }
}
.back-row { display:flex; gap:10px; align-items:center; color:var(--muted); margin-bottom:14px; font-size:13px; }
.score-legend { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
.legend-pill { border:1px solid var(--line); background:white; padding:8px 10px; border-radius:999px; color:var(--muted); font-size:12px; }
.score-person { background:white; border:1px solid var(--line); border-radius:22px; padding:18px; margin:13px 0; box-shadow:0 8px 24px rgba(23,63,50,.04); }
.score-person-head { display:flex; justify-content:space-between; gap:14px; align-items:center; margin-bottom:14px; }
.score-person-head strong { font-size:16px; }
.presence-toggle { border:0; border-radius:999px; padding:8px 11px; font-weight:800; font-size:12px; background:var(--forest-100); color:var(--forest-800); }
.presence-toggle.absent { background:var(--red-soft); color:var(--red); }
.criteria { display:grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap:8px; }
.criterion { border:1px solid var(--line); border-radius:14px; background:white; padding:11px 8px; text-align:center; min-height:72px; color:var(--muted); }
.criterion strong { display:block; color:var(--ink); font-size:12px; margin-bottom:5px; }
.criterion.active { border-color:#a8d3bb; background:var(--forest-100); color:var(--forest-800); }
.criterion:disabled { opacity:.45; cursor:not-allowed; }
.person-total { margin-top:12px; display:flex; justify-content:flex-end; font-weight:900; color:var(--forest-800); }
.sticky-save { position: sticky; bottom: 14px; margin-top:18px; background:rgba(246,244,236,.90); backdrop-filter:blur(12px); padding:10px; border-radius:18px; display:flex; gap:10px; align-items:center; }
.sticky-save .btn-primary { flex:1; }
.sticky-save .meeting-delete-btn { flex:0 0 auto; color:#a23c32; border-color:#e4c8c4; background:#fff; }
.sticky-save .meeting-delete-btn:hover { background:#fff4f2; }

.mobile-top, .bottom-nav { display:none; }
.empty { color: var(--muted); text-align:center; padding: 28px 10px; }
.loading { min-height:100vh; display:grid; place-items:center; color:var(--forest-900); font-weight:800; }


.members-page { max-width: 1120px; }
.members-toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.members-toolbar .search-box { min-width:240px; flex:1; }
.search-box, .filter-select, .member-form input, .member-form select {
  border:1px solid var(--line); background:white; color:var(--ink); border-radius:13px; padding:12px 13px; outline:none;
}
.search-box:focus, .filter-select:focus, .member-form input:focus, .member-form select:focus { border-color:var(--forest-700); box-shadow:0 0 0 4px rgba(44,109,85,.10); }
[hidden] { display:none !important; }
.member-directory { display:grid; gap:10px; margin-top:16px; }
.member-directory-row { background:white; border:1px solid var(--line); border-radius:18px; padding:15px 16px; display:grid; grid-template-columns:auto minmax(0,1.4fr) minmax(100px,.7fr) minmax(130px,.8fr) auto; gap:13px; align-items:center; }
.member-directory-row.filtered-out { display:none !important; }
.member-directory-row.inactive { opacity:.62; background:#f7f8f6; }
.member-directory-row .member-main strong { display:block; font-size:14px; }
.member-directory-row .member-main small, .member-meta small { color:var(--muted); }
.member-meta strong { display:block; font-size:13px; margin-top:2px; }
.status-pill { display:inline-flex; align-items:center; padding:7px 9px; border-radius:999px; font-size:11px; font-weight:850; background:var(--forest-100); color:var(--forest-800); }
.status-pill.inactive { background:#eceeed; color:#6f7773; }
.members-summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:14px 0 18px; }
.mini-stat { border:1px solid var(--line); background:white; border-radius:17px; padding:15px; }
.mini-stat span { color:var(--muted); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
.mini-stat strong { display:block; font-size:24px; margin-top:6px; }
.member-modal { position:fixed; inset:0; z-index:90; display:grid; place-items:center; padding:22px; background:rgba(16,45,37,.38); backdrop-filter:blur(8px); }
.member-modal[hidden] { display:none; }
.member-modal-card { width:min(640px,100%); max-height:calc(100vh - 44px); overflow:auto; background:white; border-radius:26px; border:1px solid var(--line); box-shadow:0 24px 70px rgba(16,45,37,.24); }
.member-modal-head { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; padding:22px 22px 8px; }
.member-modal-head h2 { margin:0; font-size:24px; letter-spacing:-.03em; }
.icon-btn { width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:white; color:var(--muted); }
.member-form { padding:10px 22px 22px; }
.member-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.member-form .field { margin:0; }
.member-form .field.full { grid-column:1/-1; }
.member-form label { display:block; font-size:12px; font-weight:800; margin-bottom:7px; }
.member-form input, .member-form select { width:100%; }
.form-hint { margin-top:7px; color:var(--muted); font-size:12px; line-height:1.45; }
.staff-activation-panel { grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border:1px solid #d9e5df; border-radius:15px; background:#f5faf7; }
.staff-activation-panel[hidden] { display:none !important; }
.staff-activation-panel strong { display:block; font-size:12px; color:var(--forest-900); }
.staff-activation-panel small { display:block; margin-top:3px; color:var(--muted); font-size:11px; line-height:1.4; }
.staff-activation-panel .btn { width:auto; flex:0 0 auto; }
.member-form-actions { display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }
.member-form-actions-right { display:flex; gap:10px; }
.member-empty { background:white; border:1px dashed #cfd8d3; border-radius:20px; padding:36px 18px; text-align:center; color:var(--muted); }
.readonly-note { padding:12px 14px; background:var(--amber-soft); border:1px solid #f1ddb8; border-radius:14px; color:#806331; font-size:13px; margin-bottom:14px; }

.classes-page { max-width:1120px; }
.class-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
.class-card { border:1px solid var(--line); background:white; border-radius:22px; padding:18px; box-shadow:0 8px 26px rgba(23,63,50,.045); display:grid; gap:14px; }
.class-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.class-badge { width:44px; height:44px; border-radius:15px; display:grid; place-items:center; background:var(--forest-100); color:var(--forest-800); font-weight:900; }
.class-card h3 { margin:0; font-size:18px; letter-spacing:-.025em; }
.class-card p { margin:5px 0 0; color:var(--muted); font-size:12px; line-height:1.45; }
.class-card-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.class-card-stat { background:#f7f9f7; border-radius:13px; padding:10px; }
.class-card-stat span { display:block; color:var(--muted); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
.class-card-stat strong { display:block; margin-top:4px; font-size:16px; }
.class-progress-list { display:grid; gap:10px; margin-top:14px; }
.class-member-row { border:1px solid var(--line); background:white; border-radius:18px; padding:15px; display:grid; grid-template-columns:auto minmax(0,1fr) minmax(150px,.7fr) auto; gap:13px; align-items:center; }
.class-member-row .progress { margin-top:8px; }
.class-member-meta { color:var(--muted); font-size:12px; margin-top:4px; }
.progress-number { font-size:20px; font-weight:900; color:var(--forest-800); text-align:right; }
.class-hero { padding:20px; border-radius:22px; background:linear-gradient(135deg,var(--forest-900),var(--forest-700)); color:white; margin-bottom:16px; }
.class-hero-grid { display:grid; grid-template-columns:1.4fr repeat(3,minmax(90px,.45fr)); gap:14px; align-items:end; }

function detectUiLanguage(){
  const saved=localStorage.getItem('pt_language');
  if(['en','pt','es'].includes(saved)) return saved;
  const b=(navigator.language||'en').toLowerCase();
  if(b.startsWith('pt')) return 'pt';
  if(b.startsWith('es')) return 'es';
  return 'en';
}

function translateUiString(value){
  if(uiLanguage==='en' || !value) return value;
  const dict=UI_TRANSLATIONS[uiLanguage]||{};
  const lead=value.match(/^\s*/)?.[0]||'';
  const tail=value.match(/\s*$/)?.[0]||'';
  let s=value.trim();
  if(!s) return value;

  // Exact dictionary match first.
  if(dict[s]) return lead+dict[s]+tail;

  const lang=uiLanguage;
  const isPt=lang==='pt';
  const plural=(n,one,many)=>Number(n)===1?one:many;

  // Preserve decorative/menu icons and translate the actual label.
  const iconMatch=s.match(/^([^\p{L}\p{N}]*)([\p{L}\p{N}].*)$/u);
  if(iconMatch && iconMatch[1]){
    const translatedRest=translateUiString(iconMatch[2]).trim();
    if(translatedRest!==iconMatch[2]) return lead+iconMatch[1]+translatedRest+tail;

  let m=s.match(/^Good (morning|afternoon|evening),\s*(.+?)(\s*👋)?$/i);

      : ({morning:'Buenos días',afternoon:'Buenas tardes',evening:'Buenas noches'})[m[1].toLowerCase()];

  m=s.match(/^(\d+) leadership accounts?$/i);

  m=s.match(/^(\d+) need unit assignment$/i);

  m=s.match(/^(\d+)\/(\d+) recorded present$/i);

  m=s.match(/^(\d+) scored meetings?$/i);
  if(m) return lead+(isPt?`${m[1]} ${plural(m[1],'reunião pontuada','reuniões pontuadas')}`:`${m[1]} ${plural(m[1],'reunión puntuada','reuniones puntuadas')}`)+tail;

  m=s.match(/^Live preview of accumulated points for (.+)\.$/i);
  if(m) return lead+(isPt?`Prévia dos pontos acumulados de ${m[1]}.`:`Vista previa de los puntos acumulados de ${m[1]}.`)+tail;

  // Unit leaderboard rows.
  m=s.match(/^(\d+) Pathfinders? · (\d+) scored meetings? · ([\d.]+)% efficiency$/i);
  if(m) return lead+(isPt
    ? `${m[1]} ${plural(m[1],'Desbravador','Desbravadores')} · ${m[2]} ${plural(m[2],'reunião pontuada','reuniões pontuadas')} · ${m[3]}% de aproveitamento`
    : `${m[1]} ${plural(m[1],'Conquistador','Conquistadores')} · ${m[2]} ${plural(m[2],'reunión puntuada','reuniones puntuadas')} · ${m[3]}% de rendimiento`)+tail;

      ? `${m[1]} ${plural(m[1],'Desbravador ativo','Desbravadores ativos')} · ${m[2]} ${plural(m[2],'reunião pontuada','reuniões pontuadas')}${archived?' · Arquivada':''}`

  m=s.match(/^(\d+) core requirements(?: · (\d+) advanced)?$/i);
  if(m) return lead+(isPt
    ? `${m[1]} ${plural(m[1],'requisito básico','requisitos básicos')}${m[2]?` · ${m[2]} avançado${Number(m[2])===1?'':'s'}`:''}`

  if(m) return lead+(isPt
    ? `${m[1]} ${plural(m[1],'requisito avançado é acompanhado','requisitos avançados são acompanhados')} separadamente e não reduz${Number(m[1])===1?'':'em'} a porcentagem de conclusão básica.`
    : `${m[1]} ${plural(m[1],'requisito avanzado se registra','requisitos avanzados se registran')} por separado y no reduce${Number(m[1])===1?'':'n'} el porcentaje de finalización básica.`)+tail;

  m=s.match(/^(\d+)\/(\d+) completed(?: · (\d+) in progress)?$/i);

  m=s.match(/^Completed (.+)$/i);
  if(m) return lead+(isPt?`Concluído ${m[1]}`:`Completado ${m[1]}`)+tail;

  m=s.match(/^Last meeting (.+)$/i);

  m=s.match(/^Reassign (\d+) active Pathfinders? and (\d+) counselors? before archiving this unit\.$/i);
  if(m) return lead+(isPt
    ? `Reatribua ${m[1]} ${plural(m[1],'Desbravador ativo','Desbravadores ativos')} e ${m[2]} ${plural(m[2],'conselheiro','conselheiros')} antes de arquivar esta unidade.`
    : `Reasigna ${m[1]} ${plural(m[1],'Conquistador activo','Conquistadores activos')} y ${m[2]} ${plural(m[2],'consejero','consejeros')} antes de archivar esta unidad.`)+tail;

// Translation must be idempotent: applying it repeatedly to an already translated

function translateUiAttributes(root){
  const attrs=['placeholder','title','aria-label','label'];
  root.querySelectorAll('*').forEach(el=>{
    if(el.closest('[data-no-i18n]')) return;
    attrs.forEach(attr=>{
      const v=el.getAttribute(attr);
      if(v){
        const translated=translateUiString(v);
        if(translated!==v) el.setAttribute(attr,translated);
      }
    });
  });
}
function applyUiLanguage(){
  if(i18nApplying) return;
  i18nApplying=true;
  document.documentElement.lang=uiLanguage==='pt'?'pt-BR':uiLanguage==='es'?'es':'en';
  try{
    mountLanguageControls();
    if(uiLanguage!=='en'){
      const walker=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);
      const nodes=[];
      while(walker.nextNode()) nodes.push(walker.currentNode);
      for(const node of nodes){
        const parent=node.parentElement;
        if(!parent || parent.closest('script,style,[data-no-i18n]')) continue;
        const next=translateUiString(node.nodeValue);
        if(next!==node.nodeValue) node.nodeValue=next;
      }
      translateUiAttributes(app);
    }
  }finally{
    i18nApplying=false;
  }
}
function scheduleUiLanguage(){
  if(i18nScheduled) return;
  i18nScheduled=true;
  requestAnimationFrame(()=>{i18nScheduled=false;applyUiLanguage();});
}
function mountLanguageControls(){
  document.querySelectorAll('.pt-language-control').forEach(el=>{
    if(!el.closest('.sidebar,.mobile-top,.login-card')) el.remove();
  });
  const sidebar=document.querySelector('.sidebar');
  if(sidebar && !sidebar.querySelector('.pt-language-control')){
    const holder=document.createElement('div'); holder.innerHTML=languageControl();
    sidebar.insertBefore(holder.firstElementChild,sidebar.querySelector('.profile-mini'));
  }
  const mobile=document.querySelector('.mobile-top');
  if(mobile && !mobile.querySelector('.pt-language-control')){
    const holder=document.createElement('div'); holder.innerHTML=languageControl();
    const avatar=mobile.querySelector('.avatar');
    if(avatar) mobile.insertBefore(holder.firstElementChild,avatar); else mobile.appendChild(holder.firstElementChild);
  }
  const login=document.querySelector('.login-card');
  if(login && !login.querySelector('.pt-language-control')){
    const holder=document.createElement('div'); holder.innerHTML=languageControl();
    login.insertBefore(holder.firstElementChild,login.firstChild);
  }
  document.querySelectorAll('[data-ui-language]').forEach(sel=>{
    sel.value=uiLanguage;
    sel.onchange=e=>setUiLanguage(e.target.value);
  });
}
function setUiLanguage(lang){
  if(!['en','pt','es'].includes(lang) || lang===uiLanguage) return;
  uiLanguage=lang;
  localStorage.setItem('pt_language',lang);
  document.documentElement.lang=lang==='pt'?'pt-BR':lang==='es'?'es':'en';
  // Re-render from the original English UI, then translate to the selected language.
  if(state){
    renderApp();
  }else{
    const invite=inviteSessionFromHash();
    if(invite?.accessToken) passwordSetupView(invite.accessToken,invite.type);
    else loginView();
  }
  scheduleUiLanguage();
}
function startUiLanguageObserver(){
  const observer=new MutationObserver(()=>{ if(!i18nApplying) scheduleUiLanguage(); });
  observer.observe(app,{childList:true,subtree:true,characterData:true});
  scheduleUiLanguage();
}

const AUTH_SESSION_KEY='pt_auth_session';
const LEGACY_ACCESS_KEY='pt_access_token';
let authRefreshPromise=null;
let authRefreshTimer=null;

function jwtExpiresAt(token=''){
  try{
    const part=String(token).split('.')[1];
    if(!part) return null;
    const base64=part.replace(/-/g,'+').replace(/_/g,'/');
    const padded=base64+'='.repeat((4-base64.length%4)%4);
    const payload=JSON.parse(atob(padded));
    return Number(payload.exp)||null;
  }catch{ return null; }
}

function readAuthSession(){
  try{
    const raw=localStorage.getItem(AUTH_SESSION_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed?.access_token) return parsed;
    }
  }catch{}
  const legacy=localStorage.getItem(LEGACY_ACCESS_KEY);
  return legacy ? {access_token:legacy,refresh_token:null,expires_at:jwtExpiresAt(legacy)} : null;
}

function scheduleAuthRefresh(session){
  if(authRefreshTimer){ clearTimeout(authRefreshTimer); authRefreshTimer=null; }
  if(!session?.refresh_token || !session?.expires_at) return;
  const delay=Math.max(5000,Math.min(2147480000,Number(session.expires_at)*1000-Date.now()-120000));
  authRefreshTimer=setTimeout(()=>{
    refreshAuthSession(true).catch(err=>{
      console.warn('Session refresh deferred.',err);
      if(readAuthSession()?.refresh_token) authRefreshTimer=setTimeout(()=>refreshAuthSession(true).catch(()=>{}),60000);
    });
  },delay);
}

function saveAuthSession(payload={}){
  const accessToken=payload.access_token;
  if(!accessToken) throw new Error('Authentication session is missing an access token.');
  const previous=readAuthSession();
  const expiresAt=Number(payload.expires_at)
    || (Number(payload.expires_in)?Math.floor(Date.now()/1000)+Number(payload.expires_in):null)
    || jwtExpiresAt(accessToken);
  const session={
    access_token:accessToken,
    refresh_token:payload.refresh_token || previous?.refresh_token || null,
    expires_at:expiresAt
  };
  localStorage.setItem(AUTH_SESSION_KEY,JSON.stringify(session));
  localStorage.removeItem(LEGACY_ACCESS_KEY);
  if(state?.mode==='live') state.token=session.access_token;
  scheduleAuthRefresh(session);
  return session;
}

function clearAuthSession(){
  if(authRefreshTimer){ clearTimeout(authRefreshTimer); authRefreshTimer=null; }
  localStorage.removeItem(AUTH_SESSION_KEY);
  localStorage.removeItem(LEGACY_ACCESS_KEY);
}

async function refreshAuthSession(force=false){
  if(authRefreshPromise) return authRefreshPromise;
  authRefreshPromise=(async()=>{
    const current=readAuthSession();
    if(!current?.refresh_token) throw new Error('Session refresh is unavailable. Please sign in again.');
    const remaining=current.expires_at?Number(current.expires_at)*1000-Date.now():0;
    if(!force && remaining>120000) return current;

    const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
      method:'POST',
      headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:current.refresh_token})
    });
    let payload={};
    try{payload=await res.json();}catch{}
    if(!res.ok || !payload.access_token || !payload.refresh_token){
      if([400,401,403].includes(res.status) || res.ok) clearAuthSession();
      throw new Error(payload.error_description||payload.msg||payload.message||'Your session has expired. Please sign in again.');
    }
    return saveAuthSession(payload);
  })();
  try{return await authRefreshPromise;}
  finally{authRefreshPromise=null;}
}

async function getValidAccessToken(fallbackToken=null,forceRefresh=false){
  const current=readAuthSession();
  if(current?.access_token){
    const remaining=current.expires_at?Number(current.expires_at)*1000-Date.now():Infinity;
    if(current.refresh_token && (forceRefresh || remaining<=120000)){
      const refreshed=await refreshAuthSession(true);
      return refreshed.access_token;
    }
    return current.access_token;
  }
  if(fallbackToken) return fallbackToken;
  throw new Error('Authentication required.');
}

async function authenticatedFetch(url,options={},fallbackToken=null,retry=true){
  const token=await getValidAccessToken(fallbackToken,false);
  const headers=new Headers(options.headers||{});
  if(!headers.has('apikey')) headers.set('apikey',SUPABASE_KEY);
  headers.set('Authorization',`Bearer ${token}`);
  const res=await fetch(url,{...options,headers});
  if(res.status===401 && retry && readAuthSession()?.refresh_token){
    await refreshAuthSession(true);
    return authenticatedFetch(url,options,null,false);
  }
  return res;
}

function initials(name='') { return name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(); }
function esc(value='') { return String(value ?? '').replace(/[&<>"']/g, ch=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch])); }
function gradeClassOrder(grade){ return ({5:1,6:2,7:3,8:4,9:5,10:6})[Number(grade)] || null; }
function classForGrade(grade){ const order=gradeClassOrder(grade); return order ? state?.classLevels?.find(c=>Number(c.order_index)===order) || null : null; }
function unitName(unitId){ return state?.units?.find(u=>String(u.id)===String(unitId))?.name || 'No unit'; }
function availableClassLevels(){
  const levels = state?.classLevels?.length ? state.classLevels : demoClassLevels;
  if(state?.mode==='live' && state?.user?.role==='instructor') {
    const allowed = new Set((state.staffClassLinks||[])
      .filter(link=>String(link.profile_id)===String(state.user.id))
      .map(link=>String(link.class_level_id)));
    return levels.filter(cl=>allowed.has(String(cl.id)));
  }
  return levels;
}
function className(classId){ return availableClassLevels().find(c=>String(c.id)===String(classId))?.name || 'No class'; }
function visibleMembers(){
  if(state?.mode==='demo') return (state.members||[]).map(m=>({...m,current_class_level_id:demoClassLevels.find(c=>c.name===m.class)?.id||null,active:true,unit_id:'demo-unit'}));
  return state?.allMembers || [];
}
function demoRequirements(){
  const cats=['Personal Growth','Spiritual Discovery','Serving Others','Friendship Development'];
  return demoClassLevels.flatMap((cl,ci)=>cats.map((category,i)=>({
    id:`${cl.id}-r${i+1}`,class_level_id:cl.id,code:String(i+1),title:['Grade Requirement','Bible Learning','Community Service','Team Development'][i],description:'Demo requirement for preview mode.',category,sort_index:(i+1)*10,is_advanced:false
  })));
}
function availableRequirements(){ return state?.requirements?.length ? state.requirements : (state?.mode==='demo' ? demoRequirements() : []); }
function statusKey(memberId,requirementId){ return `${memberId}::${requirementId}`; }
function requirementStatus(memberId,requirementId){
  return (state?.requirementStatuses||[]).find(x=>String(x.member_id)===String(memberId)&&String(x.requirement_id)===String(requirementId)) || null;
}
function normalizedRequirementStatus(memberId,requirementId){
  const row=requirementStatus(memberId,requirementId);
  if(row?.status==='completed' || row?.completed_at) return 'completed';
  if(row?.status==='in_progress') return 'in_progress';
  return 'not_completed';
}
function requirementsForClass(classId,advanced=null){
  return availableRequirements().filter(r=>String(r.class_level_id)===String(classId) && (advanced===null || !!r.is_advanced===advanced)).sort((a,b)=>(a.sort_index||0)-(b.sort_index||0));
}
function memberClassProgress(member){
  const classId=member.current_class_level_id || member.class_id || demoClassLevels.find(c=>c.name===member.class)?.id || null;
  const reqs=requirementsForClass(classId,false);
  const completed=reqs.filter(r=>normalizedRequirementStatus(member.id,r.id)==='completed').length;
  const inProgress=reqs.filter(r=>normalizedRequirementStatus(member.id,r.id)==='in_progress').length;
  return {total:reqs.length,completed,inProgress,pct:reqs.length?Math.round(completed/reqs.length*100):0};
}
function unitClassProgress(members=state?.members||[]){
  const items=members.filter(m=>(m.current_class_level_id||m.class_id||m.class));
  if(!items.length) return 0;
  const progresses=items.map(memberClassProgress).filter(p=>p.total>0);
  return progresses.length ? Math.round(progresses.reduce((sum,p)=>sum+p.pct,0)/progresses.length) : 0;
}
function formatShortDate(value){
  if(!value) return '';
  const d=new Date(value); if(Number.isNaN(d.getTime())) return '';
  return d.toLocaleDateString(uiLocale(),{month:'short',day:'numeric',year:'numeric'});
}
function maxScore(){ return scoreCategories.reduce((a,c)=>a+c.points,0); }
function excellenceConfig(){

    attendanceWeight:Number(s.excellence_attendance_weight??30),

    minAttendance:Number(s.excellence_min_attendance??60)
  };
}
function memberPoints(m){ if(!m.present) return 0; return scoreCategories.reduce((sum,c)=>sum+(m.scores?.[c.key] ? c.points : 0),0); }
function activeUnitId(){ return state?.selectedUnitId || state?.user?.unit_id || null; }

function inviteSessionFromHash(){
  if(!location.hash) return null;
  const params=new URLSearchParams(location.hash.replace(/^#/,'').trim());
  const accessToken=params.get('access_token');
  const refreshToken=params.get('refresh_token');
  const expiresIn=params.get('expires_in');
  const expiresAt=params.get('expires_at');
  const type=params.get('type');
  const error=params.get('error_description') || params.get('error');
  if(error) return {error};
  if(accessToken && ['invite','recovery','signup'].includes(type)) return {accessToken,refreshToken,expiresIn,expiresAt,type};
  return null;
}

async function sb(path, token) {
  const res=await authenticatedFetch(`${SUPABASE_URL}/rest/v1/${path}`,{
    headers:{Accept:'application/json'}
  },token);
  if(!res.ok) throw new Error(`Data request failed (${res.status}).`);
  return res.json();
}

async function sbWrite(path, token, { method='POST', body, prefer='return=minimal' }={}) {
  const res=await authenticatedFetch(`${SUPABASE_URL}/rest/v1/${path}`,{
    method,
    headers:{
      Accept:'application/json',
      'Content-Type':'application/json',
      Prefer:prefer
    },
    body:body===undefined?undefined:JSON.stringify(body)
  },token);
  if(!res.ok){
    let detail='';
    try{const payload=await res.json();detail=payload.message||payload.details||payload.hint||'';}catch{}
    throw new Error(detail||`Save failed (${res.status}).`);
  }
  if(state?.mode==='live' && state?.user?.role==='director') state.auditLoaded=false;
  if(res.status===204) return null;
  const text=await res.text();
  return text?JSON.parse(text):null;
}

async function callEdgeFunction(name, body) {
  const res=await authenticatedFetch(`${SUPABASE_URL}/functions/v1/${name}`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  let payload={};
  try{payload=await res.json();}catch{}
  if(!res.ok) throw new Error(payload.error||payload.message||`Request failed (${res.status}).`);
  return payload;
}

async function loadAuthenticatedState(token) {
  const activeToken=await getValidAccessToken(token,false);
  const userRes=await authenticatedFetch(`${SUPABASE_URL}/auth/v1/user`,{},activeToken);
  if(!userRes.ok) throw new Error('Your session could not be loaded.');
  const authUser=await userRes.json();
  const profiles=await sb(`profiles?id=eq.${encodeURIComponent(authUser.id)}&select=id,full_name,email,position_title,role,club_id,unit_id,active`,activeToken);
  const profile = profiles[0];
  if(!profile) throw new Error('Your Pathfinder Track profile is not configured yet.');
  if(profile.active===false) throw new Error('Your Pathfinder Track access is inactive. Contact your club director.');
  if(!profile.club_id) throw new Error('Your account is not assigned to a club yet.');
  if(['parent','pathfinder'].includes(profile.role)){
    await window.PTPortal.load(profile,activeToken);
    return;
  }

  const today = localISODate();
  const [clubs, units, members, categories, meetings, clubYears, clubSettingsRows, classLevels, requirements, requirementStatuses, staffProfiles, staffClassLinks] = await Promise.all([
    sb(`clubs?id=eq.${encodeURIComponent(profile.club_id)}&select=id,name,location`, activeToken),
    profile.unit_id ? sb(`units?id=eq.${encodeURIComponent(profile.unit_id)}&select=id,name,active,created_at`, activeToken) : sb(`units?club_id=eq.${encodeURIComponent(profile.club_id)}&select=id,name,active,created_at&order=name`, activeToken),
    sb(`members?club_id=eq.${encodeURIComponent(profile.club_id)}&select=id,full_name,school_grade,current_class_level_id,unit_id,active,created_at,class_levels(name)&order=full_name`, activeToken),
    sb(`score_categories?club_id=eq.${encodeURIComponent(profile.club_id)}&select=id,name,default_points,is_bonus,active,sort_order&order=sort_order`, activeToken),
    sb(`meetings?club_id=eq.${encodeURIComponent(profile.club_id)}&select=id,meeting_date,title,unit_id,club_year_id,meeting_type,unit_bonus_points&order=meeting_date.desc&limit=200`, activeToken),
    sb(`club_years?club_id=eq.${encodeURIComponent(profile.club_id)}&select=id,label,start_date,end_date,active,created_at&order=start_date.desc`, activeToken),
    sb(`club_settings?club_id=eq.${encodeURIComponent(profile.club_id)}&select=club_id,excellence_score_weight,excellence_attendance_weight,excellence_class_weight,excellence_min_meetings,excellence_min_attendance,updated_at&limit=1`, activeToken),
    sb(`class_levels?select=id,name,order_index&order=order_index`, activeToken),
    sb(`requirements?select=id,class_level_id,code,title,description,category,sort_index,is_advanced&order=sort_index`, activeToken),
    sb(`member_requirement_status?select=id,member_id,requirement_id,status,completed_at,signed_by,notes,updated_at`, activeToken),
    profile.role==='director' ? sb(`profiles?club_id=eq.${encodeURIComponent(profile.club_id)}&select=id,full_name,email,position_title,role,club_id,unit_id,active&order=full_name`, activeToken) : Promise.resolve([]),
    ['director','instructor'].includes(profile.role) ? sb(`instructor_class_levels?select=profile_id,class_level_id`, activeToken) : Promise.resolve([]),
  ]);

  const liveCategories = categories
    .filter(c=>c.active!==false && !c.is_bonus)
    .map(c=>({ id:c.id, key:c.id, name:c.name, points:c.default_points, icon:categoryIcon(c.name) }));
  scoreCategories = liveCategories.length ? liveCategories : structuredClone(defaultScoreCategories);

  const storedUnitId = localStorage.getItem('pt_unit_id');
  const selectableUnits = profile.role==='director' ? units.filter(u=>u.active!==false) : units;
  const selectedUnitId = profile.unit_id
    || (selectableUnits.some(u=>String(u.id)===String(storedUnitId)) ? storedUnitId : null)
    || selectableUnits[0]?.id
    || null;

  state = {
    mode:'live', token:readAuthSession()?.access_token||activeToken,
    user:profile,
    club:clubs[0] || {name:'My Club'},
    units,
    selectedUnitId,
    unit: units.find(u=>String(u.id)===String(selectedUnitId)) || {name:'No Unit'},
    allMembers:members,
    members:[],
    categories,
    clubYears,
    clubYear:clubYears.find(y=>y.active===true) || null,
    clubSettings:clubSettingsRows[0] || {
      club_id:profile.club_id,
      excellence_score_weight:50,
      excellence_attendance_weight:30,
      excellence_class_weight:20,
      excellence_min_meetings:3,
      excellence_min_attendance:60
    },
    classLevels,
    requirements,
    requirementStatuses,
    staff:staffProfiles,
    staffClassLinks,
    meetings,
    meeting:null,
    scoreboardMeetings:[],
    scoreboardScores:[],
    scoreboardAttendance:[],
    scoreboardLoaded:false,
    auditLogs:[],
    auditLoaded:false,
  };

  await loadSelectedUnit(today);
  if(profile.role==='director') {
    try { await loadScoreboardData(); }
    catch(err) { console.error('Director dashboard scoring data could not be loaded.', err); }
  }
}

async function loadSelectedUnit(dateStr=localISODate()) {
  const unitId = activeUnitId();
  if(!state || !unitId) {
    if(state){ state.members=[]; state.meeting={id:null,rawDate:dateStr,date:formatMeetingDate(dateStr),title:'Club Meeting',unit_id:null,meeting_type:'regular',unit_bonus_points:0}; }
    return;
  }

  state.selectedUnitId = unitId;
  state.unit = state.units.find(u=>String(u.id)===String(unitId)) || {id:unitId,name:'Selected Unit'};
  const todayMeeting = state.meetings.find(m=>m.meeting_date===dateStr && String(m.unit_id)===String(unitId)) || null;
  let attendance = [], scores = [];
  if(todayMeeting) {
    [attendance, scores] = await Promise.all([
      sb(`attendance?meeting_id=eq.${encodeURIComponent(todayMeeting.id)}&select=member_id,present`, state.token),
      sb(`meeting_scores?meeting_id=eq.${encodeURIComponent(todayMeeting.id)}&select=member_id,category_id,points_awarded,max_points_snapshot`, state.token),
    ]);
  }

  const attendanceByMember = new Map(attendance.map(a=>[String(a.member_id),a]));
  const scoresByMember = new Map();
  for(const row of scores) {
    const key = String(row.member_id);
    if(!scoresByMember.has(key)) scoresByMember.set(key,new Map());
    scoresByMember.get(key).set(String(row.category_id),row);
  }

  state.members = state.allMembers
    .filter(m=>m.active!==false && String(m.unit_id)===String(unitId))
    .map(m=>{
      const memberAttendance = attendanceByMember.get(String(m.id));
      const memberScoreRows = scoresByMember.get(String(m.id));
      const present = todayMeeting ? (memberAttendance ? memberAttendance.present : true) : true;
      const scoreState = {};
      for(const c of scoreCategories) {
        if(todayMeeting && memberScoreRows?.size) scoreState[c.key] = (memberScoreRows.get(String(c.id))?.points_awarded || 0) > 0;
        else scoreState[c.key] = present;
      }
      return {id:m.id,full_name:m.full_name,class:m.class_levels?.name||className(m.current_class_level_id),class_id:m.current_class_level_id,grade:m.school_grade,unit_id:m.unit_id,active:m.active,present,scores:scoreState};
    });

  state.meeting = todayMeeting
    ? {...todayMeeting,date:formatMeetingDate(todayMeeting.meeting_date),rawDate:todayMeeting.meeting_date}
    : {id:null,meeting_date:dateStr,rawDate:dateStr,date:formatMeetingDate(dateStr),title:'Club Meeting',unit_id:unitId,meeting_type:'regular',unit_bonus_points:0};
}

function dashboardGreeting(){

function directorRecentMeetings(limit=5){
  const scoreMap=new Map();
  const attendanceMap=new Map();
  for(const row of state.scoreboardScores||[]){
    const key=String(row.meeting_id);
    if(!scoreMap.has(key)) scoreMap.set(key,[]);
    scoreMap.get(key).push(row);
  }
  for(const row of state.scoreboardAttendance||[]){
    const key=String(row.meeting_id);
    if(!attendanceMap.has(key)) attendanceMap.set(key,[]);
    attendanceMap.get(key).push(row);
  }
  return (state.scoreboardMeetings||[]).slice().sort((a,b)=>String(b.meeting_date).localeCompare(String(a.meeting_date))).slice(0,limit).map(m=>{
    const scores=scoreMap.get(String(m.id))||[];
    const attendance=attendanceMap.get(String(m.id))||[];
    const memberEarned=scores.reduce((sum,row)=>sum+Number(row.points_awarded||0),0);
    const specialPoints=Math.max(0,Number(m.unit_bonus_points||0));
    const earned=memberEarned+specialPoints;
    const possible=scores.reduce((sum,row)=>sum+Number(row.max_points_snapshot||0),0);
    const present=attendance.filter(a=>a.present===true).length;
    return {...m,memberEarned,specialPoints,earned,possible,present,attendanceRecords:attendance.length,scored:scores.length>0||specialPoints>0};
  });
}

function directorDashboardSnapshot(){
  const activeMembers=(state.allMembers||[]).filter(m=>m.active!==false);
  const activeUnits=(state.units||[]).filter(u=>u.active!==false);
  const activeStaff=(state.staff||[]).filter(p=>p.active!==false);
  const activeInstructors=activeStaff.filter(p=>p.role==='instructor');
  const board=state.scoreboardLoaded ? scoreboardSnapshot() : {ranked:activeUnits.map((u,i)=>({id:u.id,name:u.name,active:true,members:unitMembers(u.id,true).length,points:0,possible:0,meetings:0,efficiency:0,attendancePct:0,attendanceRecords:0,rank:i+1})),meetingRows:[]};
  const totalPoints=board.ranked.reduce((sum,u)=>sum+Number(u.points||0),0);
  const totalPossible=board.ranked.reduce((sum,u)=>sum+Number(u.possible||0),0);
  const totalMemberPoints=board.ranked.reduce((sum,u)=>sum+Number(u.memberPoints||0),0);
  const clubEfficiency=totalPossible?Math.round(totalMemberPoints/totalPossible*1000)/10:0;
  const attendanceRows=state.scoreboardAttendance||[];
  const present=attendanceRows.filter(a=>a.present===true).length;
  const attendancePct=attendanceRows.length?Math.round(present/attendanceRows.length*1000)/10:0;
  const classPct=unitClassProgress(activeMembers);
  const membersWithoutUnit=activeMembers.filter(m=>!m.unit_id).length;
  const membersWithoutClass=activeMembers.filter(m=>!m.current_class_level_id).length;
  const unitsWithoutCounselor=activeUnits.filter(u=>unitCounselors(u.id,true).length===0).length;
  const instructorsWithoutUnit=activeInstructors.filter(p=>!p.unit_id).length;
  const activeInstructorIds=new Set(activeInstructors.map(p=>String(p.id)));
  const assignedClassIds=new Set((state.staffClassLinks||[]).filter(link=>activeInstructorIds.has(String(link.profile_id))).map(link=>String(link.class_level_id)));
  const classesWithoutInstructor=(state.classLevels||[]).filter(cl=>!assignedClassIds.has(String(cl.id))).length;
  return {
    activeMembers,activeUnits,activeStaff,activeInstructors,board,totalPoints,totalPossible,clubEfficiency,
    attendancePct,present,attendanceRecords:attendanceRows.length,classPct,membersWithoutUnit,membersWithoutClass,
    unitsWithoutCounselor,instructorsWithoutUnit,classesWithoutInstructor,recent:directorRecentMeetings(5)
  };
}

function filterMemberDirectory() {
  const q=normalizeMemberSearch(document.getElementById('memberSearch')?.value || '');
  const unit=String(document.getElementById('memberUnitFilter')?.value || '');
  const status=String(document.getElementById('memberStatusFilter')?.value || 'active');
  let shown=0;

  document.querySelectorAll('[data-directory-member]').forEach(row=>{
    const searchable=normalizeMemberSearch(row.dataset.search || '');
    const matchesText=!q || searchable.includes(q);
    const matchesUnit=!unit || String(row.dataset.unit || '')===unit;
    const isActive=String(row.dataset.active)==='1';
    const matchesStatus=status==='all'
      || (status==='active' && isActive)
      || (status==='inactive' && !isActive);
    const show=matchesText && matchesUnit && matchesStatus;

    row.hidden=!show;
    row.classList.toggle('filtered-out',!show);
    row.setAttribute('aria-hidden',show?'false':'true');
    if(show) shown++;
  });

  const empty=document.getElementById('memberNoResults');
  if(empty) empty.hidden=shown!==0;
}

function updateClassSuggestion(autoApply=false) {
  const grade=document.getElementById('memberGrade')?.value;

  const hint=document.getElementById('classSuggestion');

  if(suggested) {
    if(hint) hint.textContent=`Suggested from Grade ${grade}: ${suggested.name}`;
    if(autoApply && select) select.value=suggested.id;
  } else if(hint) hint.textContent='No automatic Pathfinder class mapping for this grade. Choose a class manually if needed.';
}

async function saveMemberForm(e) {
  e.preventDefault();
  const msg=document.getElementById('memberFormMessage');
  const btn=document.getElementById('saveMemberBtn');
  const id=document.getElementById('memberId').value;
  const fullName=document.getElementById('memberName').value.trim();
  const schoolGrade=Number(document.getElementById('memberGrade').value);

async function loadScoreboardData(force=false){
  if(!state || state.mode!=='live' || state.user.role!=='director') return;
  if(state.scoreboardLoaded && !force) return;
  const year=state.clubYear;
  if(!year){
    state.scoreboardMeetings=[];
    state.scoreboardScores=[];
    state.scoreboardAttendance=[];
    state.scoreboardLoaded=true;
    return;
  }
  let meetingQuery=`meetings?club_id=eq.${encodeURIComponent(state.user.club_id)}&select=id,meeting_date,title,unit_id,club_year_id,meeting_type,unit_bonus_points&order=meeting_date.asc`;
  if(year?.start_date) meetingQuery+=`&meeting_date=gte.${encodeURIComponent(year.start_date)}`;
  if(year?.end_date) meetingQuery+=`&meeting_date=lte.${encodeURIComponent(year.end_date)}`;
  const meetings=await sb(meetingQuery,state.token);
  const ids=meetings.map(m=>String(m.id));
  const scores=[]; const attendance=[];
  for(let i=0;i<ids.length;i+=40){
    const chunk=ids.slice(i,i+40).join(',');
    const [scoreRows,attendanceRows]=await Promise.all([
      sb(`meeting_scores?meeting_id=in.(${chunk})&select=meeting_id,member_id,category_id,points_awarded,max_points_snapshot`,state.token),
      sb(`attendance?meeting_id=in.(${chunk})&select=meeting_id,member_id,present`,state.token),
    ]);
    scores.push(...scoreRows); attendance.push(...attendanceRows);
  }
  state.scoreboardMeetings=meetings;
  state.scoreboardScores=scores;
  state.scoreboardAttendance=attendance;
  state.scoreboardLoaded=true;
}

function scoreboardSnapshot(){
  const units=(state.units||[]).map(u=>({
    id:u.id,name:u.name,active:u.active!==false,
    members:unitMembers(u.id,true).length,
    points:0,memberPoints:0,specialPoints:0,possible:0,meetings:0,present:0,attendanceRecords:0,
  }));
  const byUnit=new Map(units.map(u=>[String(u.id),u]));
  const scoresByMeeting=new Map();
  const attendanceByMeeting=new Map();
  for(const row of state.scoreboardScores||[]){
    const key=String(row.meeting_id);
    if(!scoresByMeeting.has(key)) scoresByMeeting.set(key,[]);
    scoresByMeeting.get(key).push(row);
  }
  for(const row of state.scoreboardAttendance||[]){
    const key=String(row.meeting_id);
    if(!attendanceByMeeting.has(key)) attendanceByMeeting.set(key,[]);
    attendanceByMeeting.get(key).push(row);
  }
  const meetingRows=[];
  for(const meeting of state.scoreboardMeetings||[]){
    const unit=byUnit.get(String(meeting.unit_id));
    if(!unit) continue;
    const rows=scoresByMeeting.get(String(meeting.id))||[];
    const memberEarned=rows.reduce((sum,row)=>sum+Number(row.points_awarded||0),0);
    const possible=rows.reduce((sum,row)=>sum+Number(row.max_points_snapshot||0),0);
    const specialPoints=Math.max(0,Number(meeting.unit_bonus_points||0));
    if(!rows.length && specialPoints<=0) continue;
    const earned=memberEarned+specialPoints;
    const att=attendanceByMeeting.get(String(meeting.id))||[];
    const present=att.filter(a=>a.present===true).length;
    unit.memberPoints+=memberEarned;
    unit.specialPoints+=specialPoints;
    unit.points+=earned;
    unit.possible+=possible;
    unit.meetings+=1;
    unit.present+=present; unit.attendanceRecords+=att.length;
    meetingRows.push({
      id:meeting.id,unit_id:meeting.unit_id,unit_name:unit.name,date:meeting.meeting_date,title:meeting.title,
      meeting_type:meeting.meeting_type||'regular',specialPoints,memberEarned,earned,possible,
      efficiency:possible?Math.round(memberEarned/possible*1000)/10:0,
      present,attendanceRecords:att.length,
    });
  }
  for(const unit of units){
    unit.efficiency=unit.possible?Math.round(unit.memberPoints/unit.possible*1000)/10:0;
    unit.attendancePct=unit.attendanceRecords?Math.round(unit.present/unit.attendanceRecords*1000)/10:0;
    unit.avgPerMeeting=unit.meetings?Math.round(unit.points/unit.meetings*10)/10:0;
  }
  const ranked=units
    .filter(u=>u.active || u.points>0)
    .sort((a,b)=>b.points-a.points || b.efficiency-a.efficiency || a.name.localeCompare(b.name))
    .map((u,index)=>({...u,rank:index+1}));
  meetingRows.sort((a,b)=>String(b.date).localeCompare(String(a.date)) || b.earned-a.earned || a.unit_name.localeCompare(b.unit_name));
  return {ranked,meetingRows};
}

function excellenceSnapshot(){
  const yearStart=state.clubYear?.start_date || '0000-01-01';
  const regularMeetings=(state.scoreboardMeetings||[]).filter(m=>(m.meeting_type||'regular')==='regular');
  const regularIds=new Set(regularMeetings.map(m=>String(m.id)));

  const possibleByPair=new Map();
  const earnedByPair=new Map();
  for(const row of state.scoreboardScores||[]){
    const meetingId=String(row.meeting_id);
    if(!regularIds.has(meetingId)) continue;
    const pair=meetingId+'::'+String(row.member_id);
    possibleByPair.set(pair,(possibleByPair.get(pair)||0)+Number(row.max_points_snapshot||0));
    earnedByPair.set(pair,(earnedByPair.get(pair)||0)+Number(row.points_awarded||0));
  }

  const meetingPossible=new Map();
  for(const [pair,value] of possibleByPair){
    const meetingId=pair.split('::')[0];
    meetingPossible.set(meetingId,Math.max(meetingPossible.get(meetingId)||0,value));
  }

  const presentPairs=new Set();
  for(const row of state.scoreboardAttendance||[]){
    if(row.present===true && regularIds.has(String(row.meeting_id))){
      presentPairs.add(String(row.meeting_id)+'::'+String(row.member_id));
    }
  }

  const rows=(state.allMembers||[]).filter(m=>m.active!==false).map(member=>{
    const joinedDate=member.created_at?String(member.created_at).slice(0,10):yearStart;
    const eligibilityStart=joinedDate>yearStart?joinedDate:yearStart;
    const opportunities=regularMeetings.filter(m=>
      String(m.unit_id)===String(member.unit_id) &&
      String(m.meeting_date)>=eligibilityStart
    );

    let earned=0, possible=0, present=0;
    for(const meeting of opportunities){
      const meetingId=String(meeting.id);
      const pair=meetingId+'::'+String(member.id);
      earned+=Number(earnedByPair.get(pair)||0);
      possible+=Number(meetingPossible.get(meetingId)||0);
      if(presentPairs.has(pair)) present+=1;
    }

    const meetingCount=opportunities.length;
    const scoreEfficiency=possible?Math.round(earned/possible*1000)/10:0;
    const attendancePct=meetingCount?Math.round(present/meetingCount*1000)/10:0;
    const classProgress=memberClassProgress(member);
    const classPct=classProgress.pct||0;
    const cfg=excellenceConfig();
    const excellence=Math.round((
      scoreEfficiency*(cfg.scoreWeight/100)
      + attendancePct*(cfg.attendanceWeight/100)
      + classPct*(cfg.classWeight/100)
    )*10)/10;

    const eligible=meetingCount>=cfg.minMeetings && attendancePct>=cfg.minAttendance && possible>0;
    let eligibilityReason='Eligible';
    if(meetingCount<cfg.minMeetings){
      const n=cfg.minMeetings-meetingCount;
      eligibilityReason=n===1?'Needs 1 more meeting':`Needs ${n} more meetings`;
    }else if(attendancePct<cfg.minAttendance) eligibilityReason=`Attendance below ${cfg.minAttendance}%`;
    else if(possible<=0) eligibilityReason='No saved scoring';

    return {
      id:member.id,name:member.full_name,unit:unitName(member.unit_id),
      className:member.current_class_level_id?className(member.current_class_level_id):(member.class_levels?.name||'No class'),
      earned,possible,scoreEfficiency,present,attendanceTotal:meetingCount,attendancePct,
      classPct,classCompleted:classProgress.completed,classTotal:classProgress.total,
      meetingCount,excellence,eligible,eligibilityReason
    };
  });

  rows.sort((a,b)=>
    Number(b.eligible)-Number(a.eligible)
    || (a.eligible&&b.eligible?b.excellence-a.excellence:b.meetingCount-a.meetingCount)
    || b.attendancePct-a.attendancePct
    || b.scoreEfficiency-a.scoreEfficiency
    || b.classPct-a.classPct
    || a.name.localeCompare(b.name)
  );

  let rank=0;
  return rows.map(item=>({...item,rank:item.eligible?++rank:null}));
}
function excellenceScoreboardView(){
  if(state.mode!=='live' || state.user.role!=='director') return `${mobileTop()}<div class="readonly-note">The club-wide scoreboard is available to the club director.</div>`;
  if(!state.scoreboardLoaded) return `${mobileTop()}<div class="scoreboard-page"><div class="topbar"><div><div class="eyebrow">Pathfinder Excellence</div><h1>Pathfinder Excellence</h1><p>Loading individual results…</p></div></div><div class="member-empty">Loading scoreboard…</div></div>`;

    <div class="excellence-metric excellence-class"><span>Class progress</span><strong>${x.classPct}% <small style="font-weight:600;color:var(--muted)">(${x.classCompleted}/${x.classTotal})</small></strong></div>
    <div class="excellence-final"><strong>${x.eligible?x.excellence:'—'}</strong><small>${x.eligible?'Excellence score':'Not ranked'}</small></div>
  </div>`).join('');

  return `${mobileTop()}<div class="scoreboard-page">
    <div class="topbar"><div><div class="eyebrow">Individual recognition</div><h1>Pathfinder Excellence</h1><p>${esc(yearLabel)} · Individual ranking for the Pathfinder Excellence award.</p></div></div>
    ${scoreboardTabs()}
    <section class="excellence-hero">

      <div class="scoreboard-kpi"><span>Ranked Pathfinders</span><strong>${ranked.length}</strong></div>
      <div class="scoreboard-kpi"><span>Average score</span><strong>${avg}</strong></div>
      <div class="scoreboard-kpi"><span>In qualification</span><strong>${qualifying.length}</strong></div>
    </section>
    <section class="scoreboard-card">
      <div class="scoreboard-card-head"><h3>Pathfinder Excellence ranking</h3><p>Special unit-event points are excluded. The score is normalized so units with different numbers of meetings can be compared.</p></div>
      <div class="excellence-list">${list || '<div class="scoreboard-empty">No active Pathfinders are available for this ranking yet.</div>'}</div>
    </section>
    <div class="scoreboard-note"><strong>Excellence formula:</strong>
      <div class="excellence-formula">
        <div><strong>${cfg.scoreWeight}%</strong><span>Meeting score efficiency</span></div>
        <div><strong>${cfg.attendanceWeight}%</strong><span>Attendance</span></div>
        <div><strong>${cfg.classWeight}%</strong><span>Core class progress</span></div>
      </div>
      <div style="margin-top:10px">Eligibility requires at least ${cfg.minMeetings} regular meeting opportunities and at least ${cfg.minAttendance}% attendance. After eligibility, the ranking uses the weighted percentages above.</div>
    </div>
  </div>`;
}

    end_date:'End date',name:'Name',default_points:'Default points',is_bonus:'Bonus criterion',
    sort_order:'Order',location:'Location',excellence_score_weight:'Meeting efficiency weight',
    excellence_attendance_weight:'Attendance weight',excellence_class_weight:'Class progress weight',
    excellence_min_meetings:'Minimum meeting opportunities',
    excellence_min_attendance:'Minimum attendance',profile_id:'Instructor',class_level_id:'Class'
  };
  return map[field]||field.replaceAll('_',' ');
}

function auditValue(field,value){
  if(value===null || value===undefined || value==='') return '—';
  if(typeof value==='boolean') return value?'Yes':'No';
  if(field==='unit_id') return (state.units||[]).find(x=>String(x.id)===String(value))?.name || String(value);
  if(field==='current_class_level_id' || field==='class_level_id') return (state.classLevels||[]).find(x=>String(x.id)===String(value))?.name || String(value);
  if(field==='member_id') return (state.allMembers||[]).find(x=>String(x.id)===String(value))?.full_name || String(value);
  if(field==='meeting_id'){
    const m=(state.meetings||[]).find(x=>String(x.id)===String(value));
    return m ? `${m.title||'Meeting'} · ${formatMeetingDate(m.meeting_date)}` : String(value);
  }
  if(field==='category_id') return (state.categories||[]).find(x=>String(x.id)===String(value))?.name || String(value);
  if(field==='club_year_id') return (state.clubYears||[]).find(x=>String(x.id)===String(value))?.label || String(value);
  if(field==='requirement_id') return (state.requirements||[]).find(x=>String(x.id)===String(value))?.title || String(value);
  if(field==='profile_id') return (state.staff||[]).find(x=>String(x.id)===String(value))?.full_name || String(value);
  if(field.endsWith('_date') || field==='start_date' || field==='end_date') return formatMeetingDate(String(value));
  if(field.endsWith('_at')){
    const d=new Date(value);
    return Number.isNaN(d.getTime())?String(value):d.toLocaleString(uiLocale(),{dateStyle:'medium',timeStyle:'short'});
  }
  if(typeof value==='object') return JSON.stringify(value);
  return String(value);
}

function auditRelevantFields(log){
  const preferred={
    attendance:['present','notes'],
    meeting_scores:['points_awarded','max_points_snapshot','notes'],
    member_requirement_status:['status','completed_at','signed_by','notes'],
    members:['full_name','unit_id','current_class_level_id','school_grade','active'],
    meetings:['title','meeting_date','unit_id','meeting_type','unit_bonus_points','club_year_id'],
    units:['name','active'],
    profiles:['full_name','email','role','position_title','unit_id','active'],
    club_years:['label','start_date','end_date','active'],
    score_categories:['name','default_points','active','is_bonus','sort_order'],
    club_settings:['excellence_score_weight','excellence_attendance_weight','excellence_class_weight','excellence_min_meetings','excellence_min_attendance'],
    clubs:['name','location'],
    instructor_class_levels:['profile_id','class_level_id']
  };
  const changed=Array.isArray(log.changed_fields)?log.changed_fields:[];
  const ordered=(preferred[log.entity_type]||[]).filter(f=>changed.includes(f));
  if(ordered.length) return ordered;
  return changed.filter(f=>!['id','club_id','created_by','recorded_by'].includes(f));
}

function auditText(en,pt,es){ return uiLanguage==='pt'?pt:(uiLanguage==='es'?es:en); }

function auditActionLabel(action=''){
  const maps={
    en:{insert:'Created',update:'Updated',delete:'Deleted',completed:'Completed',uncompleted:'Uncompleted'},
    pt:{insert:'Criado',update:'Atualizado',delete:'Apagado',completed:'Concluído',uncompleted:'Reaberto'},
    es:{insert:'Creado',update:'Actualizado',delete:'Eliminado',completed:'Completado',uncompleted:'Reabierto'}
  };
  return (maps[uiLanguage]||maps.en)[action]||action||auditText('Changed','Alterado','Modificado');
}

function auditSummary(log){
  const label=log.entity_label||auditEntityMeta(log.entity_type).label;
  const oldData=log.old_data||{}, newData=log.new_data||{};
  if(log.entity_type==='attendance'){
    const value=newData.present ?? oldData.present;
    const verb=value===true
      ? auditText('Marked present','Marcou presença','Marcó presente')
      : value===false
        ? auditText('Marked absent','Marcou ausência','Marcó ausente')
        : auditText('Presence updated','Presença atualizada','Asistencia actualizada');
    return `${verb} · ${label}`;
  }
  if(log.entity_type==='meeting_scores'){
    const oldPts=oldData.points_awarded;
    const newPts=newData.points_awarded;
    if(oldPts!==undefined && newPts!==undefined && oldPts!==newPts) return `${auditText('Score changed','Pontuação alterada','Puntuación modificada')} ${oldPts} → ${newPts} · ${label}`;
    if(newPts!==undefined) return `${newPts} ${auditText('points recorded','pontos registrados','puntos registrados')} · ${label}`;
    return `${auditText('Score record','Registro de pontuação','Registro de puntuación')} · ${label}`;
  }
  if(log.entity_type==='member_requirement_status'){
    if(log.action==='completed') return `${auditText('Requirement completed','Requisito concluído','Requisito completado')} · ${label}`;
    if(log.action==='uncompleted') return `${auditText('Requirement reopened','Requisito reaberto','Requisito reabierto')} · ${label}`;
    return `${auditText('Requirement updated','Requisito atualizado','Requisito actualizado')} · ${label}`;
  }
  if(log.entity_type==='club_years' && Array.isArray(log.changed_fields) && log.changed_fields.includes('active')){
    return `${newData.active?auditText('Club year activated','Ano do clube ativado','Año del club activado'):auditText('Club year closed','Ano do clube encerrado','Año del club cerrado')} · ${label}`;
  }
  if(log.entity_type==='members') return `${auditActionLabel(log.action)} · ${auditText('Pathfinder','Desbravador','Conquistador')} · ${label}`;
  if(log.entity_type==='meetings') return `${auditActionLabel(log.action)} · ${auditText('meeting/event','reunião/evento','reunión/evento')} · ${label}`;
  if(log.entity_type==='profiles') return `${auditActionLabel(log.action)} · ${auditText('staff record','registro da diretoria','registro de directiva')} · ${label}`;
  if(log.entity_type==='units') return `${auditActionLabel(log.action)} · ${auditText('unit','unidade','unidad')} · ${label}`;
  if(log.entity_type==='score_categories') return `${auditActionLabel(log.action)} · ${auditText('scoring criterion','critério de pontuação','criterio de puntuación')} · ${label}`;
  if(log.entity_type==='club_settings') return auditText('Pathfinder Excellence settings updated','Configurações do Desbravador Excelência atualizadas','Configuración de Conquistador Excelencia actualizada');
  if(log.entity_type==='clubs') return `${auditText('Club profile','Perfil do clube','Perfil del club')} · ${auditActionLabel(log.action)} · ${label}`;
  if(log.entity_type==='instructor_class_levels') return `${auditText('Class assignment','Atribuição de classe','Asignación de clase')} · ${auditActionLabel(log.action)} · ${label}`;
  return `${auditActionLabel(log.action)} · ${label}`;
}

function auditDateTime(value){
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return String(value||'');
  return d.toLocaleString(uiLocale(),{dateStyle:'medium',timeStyle:'short'});
}

function filteredAuditLogs(){
  const q=normalizeMemberSearch(document.getElementById('historySearch')?.value||'');
  const type=document.getElementById('historyType')?.value||'';
  const action=document.getElementById('historyAction')?.value||'';
  const actor=document.getElementById('historyActor')?.value||'';
  const from=document.getElementById('historyFrom')?.value||'';
  const to=document.getElementById('historyTo')?.value||'';
  return (state.auditLogs||[]).filter(log=>{
    if(type && log.entity_type!==type) return false;
    if(action && log.action!==action) return false;
    if(actor==='__system' && log.actor_id) return false;
    if(actor && actor!=='__system' && String(log.actor_id)!==actor) return false;
    const day=String(log.created_at||'').slice(0,10);
    if(from && day<from) return false;
    if(to && day>to) return false;
    if(q){
      const hay=normalizeMemberSearch([
        log.entity_label,log.actor_display_name,log.action,
        auditEntityMeta(log.entity_type).label,
        ...(Array.isArray(log.changed_fields)?log.changed_fields:[])
      ].filter(Boolean).join(' '));
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function historyChangesHtml(log){
  const fields=auditRelevantFields(log);
  if(!fields.length) return '<div class="report-muted">No field-level details available.</div>';
  return `<div class="history-change-list">${fields.map(field=>{
    const oldValue=auditValue(field,log.old_data?.[field]);
    const newValue=auditValue(field,log.new_data?.[field]);
    return `<div class="history-change"><span>${esc(auditFieldLabel(field))}</span><div class="history-old">${esc(oldValue)}</div><span class="history-arrow">→</span><div class="history-new">${esc(newValue)}</div></div>`;
  }).join('')}</div>`;
}

function historyResultsHtml(logs){
  const actorCount=new Set(logs.map(x=>x.actor_id||'system')).size;
  const meetingActivity=logs.filter(x=>['attendance','meeting_scores','meetings'].includes(x.entity_type)).length;
  const latest=logs[0]?.created_at ? auditDateTime(logs[0].created_at) : '—';
  const visible=logs.slice(0,200);
  const list=visible.map(log=>{
    const meta=auditEntityMeta(log.entity_type);
    const actor=log.actor_display_name||'System';
    return `<article class="history-item">
      <div class="history-main">
        <div class="history-icon">${meta.icon}</div>

        <div class="history-meta"><strong>${esc(auditDateTime(log.created_at))}</strong><span>${esc(log.source==='legacy_requirement_audit'?'Historical class audit':'Automatic audit')}</span></div>

  return `<section class="history-summary">

  <div class="history-list">${list||'<div class="history-empty">No changes match the selected filters.</div>'}</div>`;
}

async function saveClubProfile(e){
  e.preventDefault();
  const name=(document.getElementById("settingsClubName")?.value||"").trim();
  const location=(document.getElementById("settingsClubLocation")?.value||"").trim();
  if(!name){ setSettingsMessage("clubProfileMessage","Club name is required.",true); return; }
  try{ setSettingsMessage("clubProfileMessage","Saving…"); await sbWrite(`clubs?id=eq.${encodeURIComponent(state.user.club_id)}`,state.token,{method:"PATCH",body:{name,location:location||null},prefer:"return=representation"}); await reloadSettingsData(); }
  catch(err){ console.error(err); setSettingsMessage("clubProfileMessage",err.message||"Club settings could not be saved.",true); }
}

async function createClubYear(e){
  e.preventDefault();
  const label=(document.getElementById("newClubYearLabel")?.value||"").trim();
  const start=document.getElementById("newClubYearStart")?.value||"";
  const end=document.getElementById("newClubYearEnd")?.value||"";
  const activate=!!document.getElementById("newClubYearActivate")?.checked;
  if(!label||!start||!end){ setSettingsMessage("clubYearMessage","Label, start date and end date are required.",true); return; }
  if(end<start){ setSettingsMessage("clubYearMessage","End date must be on or after start date.",true); return; }
  const overlap=(state.clubYears||[]).find(y=>start<=String(y.end_date)&&end>=String(y.start_date));
  if(overlap){ setSettingsMessage("clubYearMessage",`This period overlaps ${overlap.label}.`,true); return; }
  try{
    setSettingsMessage("clubYearMessage","Creating…");
    const rows=await sbWrite("club_years",state.token,{body:[{club_id:state.user.club_id,label,start_date:start,end_date:end,active:false}],prefer:"return=representation"});
    const created=rows?.[0]; if(!created?.id) throw new Error("The club year could not be created.");
    if(activate){
      const previous=state.clubYear?.id||null;
      if(previous) await sbWrite(`club_years?id=eq.${encodeURIComponent(previous)}`,state.token,{method:"PATCH",body:{active:false}});
      try{ await sbWrite(`club_years?id=eq.${encodeURIComponent(created.id)}`,state.token,{method:"PATCH",body:{active:true}}); }
      catch(err){ if(previous) try{ await sbWrite(`club_years?id=eq.${encodeURIComponent(previous)}`,state.token,{method:"PATCH",body:{active:true}}); }catch{} throw err; }
    }
    await reloadSettingsData();
  }catch(err){ console.error(err); setSettingsMessage("clubYearMessage",err.message||"Club year could not be created.",true); }
}

async function activateClubYear(id){
  const target=(state.clubYears||[]).find(y=>String(y.id)===String(id));
  if(!target||target.active) return;
  if(!confirm(`Activate ${target.label} as the club working year?`)) return;
  const previous=state.clubYear?.id||null;
  try{
    if(previous) await sbWrite(`club_years?id=eq.${encodeURIComponent(previous)}`,state.token,{method:"PATCH",body:{active:false}});
    try{ await sbWrite(`club_years?id=eq.${encodeURIComponent(target.id)}`,state.token,{method:"PATCH",body:{active:true}}); }
    catch(err){ if(previous) try{ await sbWrite(`club_years?id=eq.${encodeURIComponent(previous)}`,state.token,{method:"PATCH",body:{active:true}}); }catch{} throw err; }
    await reloadSettingsData();
  }catch(err){ console.error(err); alert(err.message||"Club year could not be activated."); }
}

async function closeClubYear(id){
  const target=(state.clubYears||[]).find(y=>String(y.id)===String(id));
  if(!target?.active) return;
  if(!confirm(`Close ${target.label}? Scoreboard and new meetings will pause until another year is activated.`)) return;
  try{ await sbWrite(`club_years?id=eq.${encodeURIComponent(id)}`,state.token,{method:"PATCH",body:{active:false}}); await reloadSettingsData(); }
  catch(err){ console.error(err); alert(err.message||"Club year could not be closed."); }
}

async function saveScoreCategory(id){
  const name=(document.getElementById("settingsCatName_"+id)?.value||"").trim();

async function loadReportYearData(year){
  if(!year || String(year.id)===String(state.clubYear?.id)) return;
  if(state.reportArchive?.yearId===String(year.id)) return;
  const query='meetings?club_id=eq.'+encodeURIComponent(state.user.club_id)
    +'&meeting_date=gte.'+encodeURIComponent(year.start_date)
    +'&meeting_date=lte.'+encodeURIComponent(year.end_date)
    +'&select=id,meeting_date,title,unit_id,club_year_id,meeting_type,unit_bonus_points&order=meeting_date.asc';
  const meetings=await sb(query,state.token),scores=[],attendance=[];
  const ids=meetings.map(m=>String(m.id));
  for(let i=0;i<ids.length;i+=40){
    const chunk=ids.slice(i,i+40).join(',');
    const [sr,ar]=await Promise.all([
      sb('meeting_scores?meeting_id=in.('+chunk+')&select=meeting_id,member_id,category_id,points_awarded,max_points_snapshot',state.token),
      sb('attendance?meeting_id=in.('+chunk+')&select=meeting_id,member_id,present',state.token)

  }

function reportScoreMaps(){
