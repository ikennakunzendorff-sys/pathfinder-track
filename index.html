function memberReportData(){
  const unitFilter=reportUnitFilter(), meetings=reportMeetingsFiltered().filter(m=>(m.meeting_type||'regular')==='regular');
  const maps=reportScoreMaps(), rows=[];
  const year=reportSelectedYear();
  const eligibleMembers=(state.allMembers||[]).filter(m=>m.active!==false&&(!unitFilter||String(m.unit_id)===String(unitFilter)));
  const cfg=excellenceConfig();
  for(const member of eligibleMembers){
    const start=[year?.start_date||'0000-01-01',String(member.created_at||'').slice(0,10)].sort().pop();
    const opportunities=meetings.filter(mt=>String(mt.unit_id)===String(member.unit_id)&&String(mt.meeting_date)>=start);
    let earned=0,possible=0,present=0;
    for(const mt of opportunities){
      const scoreRows=maps.scoreMap.get(String(mt.id))||[];
      const mine=scoreRows.filter(x=>String(x.member_id)===String(member.id));
      const maxByMember=new Map();
      for(const sr of scoreRows){const key=String(sr.member_id);maxByMember.set(key,(maxByMember.get(key)||0)+Number(sr.max_points_snapshot||0));}
      earned+=mine.reduce((sum,x)=>sum+Number(x.points_awarded||0),0);
      possible+=Math.max(0,...maxByMember.values());
      if((maps.attendanceMap.get(String(mt.id))||[]).some(x=>String(x.member_id)===String(member.id)&&x.present===true))present++;
    }
    const attendance=opportunities.length?Math.round(present/opportunities.length*1000)/10:0;
    const efficiency=possible?Math.round(earned/possible*1000)/10:0;
    const progress=memberClassProgress(member);
    const weighted=Math.round((efficiency*cfg.scoreWeight/100+attendance*cfg.attendanceWeight/100+progress.pct*cfg.classWeight/100)*10)/10;
    const eligible=opportunities.length>=cfg.minMeetings&&attendance>=cfg.minAttendance&&possible>0;
    const reason=opportunities.length<cfg.minMeetings?'Insufficient meetings':attendance<cfg.minAttendance?'Insufficient attendance':possible<=0?'No scoring': 'Eligible';
    rows.push([member.full_name,unitName(member.unit_id),member.current_class_level_id?className(member.current_class_level_id):'No class',opportunities.length,present+'/'+opportunities.length,attendance+'%',earned+'/'+possible,efficiency+'%',progress.completed+'/'+progress.total,progress.pct+'%',eligible?weighted:'—',eligible?'Eligible':reason]);
  }
  rows.sort((x,y)=>x[0].localeCompare(y[0]));
  return {title:'Pathfinder report',subtitle:'Attendance and scoring reflect the selected period. Class placement and progress reflect the current state, not a historical snapshot. Excellence figures are period estimates.',headers:['Pathfinder','Unit (current)','Class (current)','Meeting opportunities','Presence','Attendance','Points','Efficiency','Class requirements (current)','Class progress (current)','Excellence (estimate)','Status'],rows};
}

async function refreshUnitsFromDb(){
  state.units=await sb(`units?club_id=eq.${encodeURIComponent(state.user.club_id)}&select=id,name,active,created_at&order=name`,state.token);
  const selectable=activeUnits();
  if(!selectable.some(u=>String(u.id)===String(state.selectedUnitId))){
    state.selectedUnitId=selectable[0]?.id||null;
    if(state.selectedUnitId) localStorage.setItem('pt_unit_id',state.selectedUnitId); else localStorage.removeItem('pt_unit_id');
  }
  state.unit=state.units.find(u=>String(u.id)===String(state.selectedUnitId))||{name:'No Unit'};
  await loadSelectedUnit();
}

async function saveUnitForm(e){
  e.preventDefault();
  if(state.user.role!=='director') return;
  const msg=document.getElementById('unitFormMessage'); const btn=document.getElementById('saveUnitBtn');
  const id=document.getElementById('unitId').value;
  const name=document.getElementById('unitNameInput').value.trim();
  const selectedCounselors=Array.from(document.querySelectorAll('[data-unit-counselor]:checked')).map(x=>String(x.value));
  if(name.length<2){msg.textContent='Enter a unit name.';return;}
  const duplicate=(state.units||[]).find(u=>String(u.id)!==String(id)&&String(u.name||'').trim().toLowerCase()===name.toLowerCase());
  if(duplicate){msg.textContent='Another unit already uses this name.';return;}
  btn.disabled=true; btn.textContent='Saving…'; msg.textContent='';
  try{
    let unitId=id;
    if(id){
      await sbWrite(`units?id=eq.${encodeURIComponent(id)}`,state.token,{method:'PATCH',body:{name},prefer:'return=representation'});
    }else{
      const created=await sbWrite('units',state.token,{body:[{club_id:state.user.club_id,name,active:true}],prefer:'return=representation'});
      unitId=created?.[0]?.id;
      if(!unitId) throw new Error('The unit could not be created.');
    }
    const activeInstructors=(state.staff||[]).filter(p=>p.role==='instructor'&&p.active!==false);
    for(const p of activeInstructors){
      const isSelected=selectedCounselors.includes(String(p.id));
      const currentlyHere=String(p.unit_id||'')===String(unitId);
      if(isSelected && !currentlyHere){
        await sbWrite(`profiles?id=eq.${encodeURIComponent(p.id)}`,state.token,{method:'PATCH',body:{unit_id:unitId},prefer:'return=representation'});
      }else if(!isSelected && currentlyHere){
        await sbWrite(`profiles?id=eq.${encodeURIComponent(p.id)}`,state.token,{method:'PATCH',body:{unit_id:null},prefer:'return=representation'});
      }
    }
    await refreshStaffFromDb();
    await refreshUnitsFromDb();
    closeUnitEditor(); renderApp();
  }catch(err){console.error(err);msg.textContent=err.message||'Unit could not be saved.';btn.disabled=false;btn.textContent=id?'Save unit':'Create unit';}
}

async function toggleUnitActive(){
  const id=document.getElementById('unitId')?.value; if(!id) return;

}

async function saveStaffForm(e){
  e.preventDefault();
  const msg=document.getElementById('staffFormMessage'); const btn=document.getElementById('saveStaffBtn');
  const id=document.getElementById('staffId').value;
  const fullName=document.getElementById('staffName').value.trim();
  const email=document.getElementById('staffEmail').value.trim().toLowerCase();
  const positionTitle=document.getElementById('staffTitle').value.trim();
  const current=(state.staff||[]).find(x=>String(x.id)===String(id));
  if(current && ['parent','pathfinder'].includes(current.role))return;
  const isSelf=current && String(current.id)===String(state.user.id);
  const role=isSelf?'director':document.getElementById('staffRole').value;
  const unitId=role==='instructor'?(document.getElementById('staffUnit').value||null):null;
  const classIds=role==='instructor'?Array.from(document.querySelectorAll('[data-staff-class]:checked')).map(x=>x.value):[];

  btn.disabled=true; btn.textContent=id?'Saving…':'Sending…'; msg.textContent='';
  try{
    if(!id){
      const result=await callEdgeFunction('staff-invite',{email,full_name:fullName,position_title:positionTitle,role,unit_id:unitId,class_level_ids:classIds});
      await refreshStaffFromDb(); closeStaffEditor(); renderApp();
      alert(translateUiString(result.invited?'Invitation sent. The staff member can use the email link to activate access.':'Existing Pathfinder Track account added to this club.'));
      return;

    await sbWrite(`instructor_class_levels?profile_id=eq.${encodeURIComponent(id)}`,state.token,{method:'DELETE',prefer:'return=minimal'});

      await sbWrite('instructor_class_levels',state.token,{body:classIds.map(class_level_id=>({profile_id:id,class_level_id})),prefer:'return=minimal'});

function classesOverviewView() {
  const levels=availableClassLevels();
  const members=visibleMembers().filter(m=>m.active!==false);
  const cards=levels.map((cl,index)=>{
    const roster=members.filter(m=>String(m.current_class_level_id)===String(cl.id));
    const standard=requirementsForClass(cl.id,false);
    const advanced=requirementsForClass(cl.id,true);
    const avg=roster.length ? Math.round(roster.reduce((sum,m)=>sum+memberClassProgress(m).pct,0)/roster.length) : 0;
    return `<article class="class-card">
      <div class="class-card-top"><div><div class="class-badge">${index+1}</div></div><span class="status-pill">${avg}%</span></div>
      <div><h3>${esc(cl.name)}</h3><p>${standard.length} core requirements${advanced.length?` · ${advanced.length} advanced`:''}</p></div>

      <div class="progress"><span style="width:${avg}%"></span></div>
      <button class="btn btn-ghost" data-open-class="${cl.id}">Open class →</button>
    </article>`;
  }).join('');
  return `${mobileTop()}<div class="classes-page">
    <div class="topbar"><div><h1>Classes</h1><p>${esc(state.club.name)} · Class requirement progress</p></div></div>
    <section class="class-grid">${cards || '<div class="class-empty">No class levels are configured.</div>'}</section>

}

function classRosterView() {

function classMemberProgressView() {
  const cl=availableClassLevels().find(c=>String(c.id)===String(selectedClassId));
  const member=visibleMembers().find(m=>String(m.id)===String(selectedClassMemberId));
  if(!cl || !member){ selectedClassMemberId=null; return classRosterView(); }
  const reqs=requirementsForClass(cl.id,null);
  const core=requirementsForClass(cl.id,false), advanced=requirementsForClass(cl.id,true);
  const coreDone=core.filter(r=>normalizedRequirementStatus(member.id,r.id)==='completed').length;
  const coreProgress=core.length?Math.round(coreDone/core.length*100):0;
  const inProgress=core.filter(r=>normalizedRequirementStatus(member.id,r.id)==='in_progress').length;
  const advDone=advanced.filter(r=>normalizedRequirementStatus(member.id,r.id)==='completed').length;
  const groups=[];
  for(const req of reqs){
    const name=req.category || 'Other';
    let group=groups.find(g=>g.name===name);
    if(!group){ group={name,items:[]}; groups.push(group); }
    group.items.push(req);
  }
  const editable=state.mode==='demo' || ['director','instructor'].includes(state.user.role);
  return `${mobileTop()}<div class="classes-page">
    <div class="back-row"><button class="btn btn-ghost" data-class-back="class">← ${esc(cl.name)}</button><span>${esc(member.full_name)}</span></div>
    <div class="topbar"><div><h1>${esc(member.full_name)}</h1><p>${esc(cl.name)} · ${member.school_grade?`Grade ${member.school_grade} · `:''}${esc(unitName(member.unit_id))}</p></div></div>
    ${!editable?'<div class="readonly-note">Your account can view this progress but cannot change requirement status.</div>':''}
    <section class="requirement-summary">
      <div class="mini-stat"><span>Core progress</span><strong>${coreProgress}%</strong></div>
      <div class="mini-stat"><span>Completed</span><strong>${coreDone}/${core.length}</strong></div>
      <div class="mini-stat"><span>In progress</span><strong>${inProgress}</strong></div>
      <div class="mini-stat"><span>Advanced</span><strong>${advDone}/${advanced.length}</strong></div>
    </section>
    <div class="progress-block"><div class="progress-label"><span>Core class completion</span><strong>${coreProgress}%</strong></div><div class="progress"><span style="width:${coreProgress}%"></span></div></div>
    ${groups.map(g=>requirementGroupHtml(g,member,editable)).join('') || '<div class="class-empty">No requirements are configured for this class.</div>'}
  </div>`;
}

function requirementGroupHtml(group,member,editable) {
  const done=group.items.filter(r=>normalizedRequirementStatus(member.id,r.id)==='completed').length;
  return `<section class="requirement-group"><div class="requirement-group-head"><h3>${esc(group.name)}</h3><span>${done}/${group.items.length} completed</span></div><div class="requirement-list">${group.items.map(r=>requirementRowHtml(r,member,editable)).join('')}</div></section>`;
}

function requirementRowHtml(req,member,editable) {
  const row=requirementStatus(member.id,req.id);
  const current=normalizedRequirementStatus(member.id,req.id);
  const signature=current==='completed' && row?.signed_by ? `Completed ${formatShortDate(row.completed_at)} · ${esc(row.signed_by)}` : '';
  return `<div class="requirement-row" data-requirement="${req.id}">
    <div><div><span class="requirement-code">${esc(req.code)}</span><span class="requirement-title">${esc(req.title)}</span>${req.is_advanced?'<span class="advanced-badge">Advanced</span>':''}</div>${req.description?`<div class="requirement-description">${esc(req.description)}</div>`:''}${row?.notes?`<div class="requirement-description"><strong>Note:</strong> ${esc(row.notes)}</div>`:''}</div>
    <div><div class="req-status-buttons">
      <button class="req-status-btn ${current==='not_completed'?'active not-completed':''}" ${editable?'':'disabled'} data-req-status="not_completed" data-member-id="${member.id}" data-requirement-id="${req.id}">Not started</button>
      <button class="req-status-btn ${current==='in_progress'?'active in-progress':''}" ${editable?'':'disabled'} data-req-status="in_progress" data-member-id="${member.id}" data-requirement-id="${req.id}">In progress</button>
      <button class="req-status-btn ${current==='completed'?'active completed':''}" ${editable?'':'disabled'} data-req-status="completed" data-member-id="${member.id}" data-requirement-id="${req.id}">Completed</button>
    </div>${signature?`<div class="requirement-signature">${signature}</div>`:''}</div>
  </div>`;
}

function upsertLocalRequirementStatus(row) {
  state.requirementStatuses ||= [];
  const i=state.requirementStatuses.findIndex(x=>String(x.member_id)===String(row.member_id)&&String(x.requirement_id)===String(row.requirement_id));
  if(i>=0) state.requirementStatuses[i]=row; else state.requirementStatuses.push(row);
}

async function setRequirementStatus(memberId,requirementId,status,button) {
  if(state.mode==='demo') {
    const row={id:statusKey(memberId,requirementId),member_id:memberId,requirement_id:requirementId,status,completed_at:status==='completed'?new Date().toISOString():null,signed_by:status==='completed'?'Demo Counselor':null,notes:null,updated_at:new Date().toISOString()};
    upsertLocalRequirementStatus(row); renderApp(); return;
  }
  if(!['director','instructor'].includes(state.user.role)) return;
  const original=button?.textContent;
  if(button){ button.disabled=true; button.textContent='Saving…'; }
  try {
    const payload=[{member_id:memberId,requirement_id:requirementId,status,completed_at:status==='completed'?new Date().toISOString():null}];
    const saved=await sbWrite('member_requirement_status?on_conflict=member_id,requirement_id',state.token,{body:payload,prefer:'resolution=merge-duplicates,return=representation'});
    if(saved?.[0]) upsertLocalRequirementStatus(saved[0]);
    else {
      const rows=await sb(`member_requirement_status?member_id=eq.${encodeURIComponent(memberId)}&requirement_id=eq.${encodeURIComponent(requirementId)}&select=id,member_id,requirement_id,status,completed_at,signed_by,notes,updated_at&limit=1`,state.token);
      if(rows?.[0]) upsertLocalRequirementStatus(rows[0]);
    }
    renderApp();
  } catch(err) {
    console.error(err); if(button){button.disabled=false;button.textContent=original;} alert(translateUiString(err.message || 'Requirement status could not be saved.'));
  }
}

async function createMeetingOrEvent(e){
  e.preventDefault();
  const msg=document.getElementById('meetingCreatorMessage');
  const btn=document.getElementById('createMeetingSubmit');
  const date=document.getElementById('newMeetingDate')?.value;
  const type=document.getElementById('newMeetingType')?.value||'regular';
  const title=(document.getElementById('newMeetingTitle')?.value||'').trim();
  if(!date || !title){ if(msg) msg.textContent='Date and title are required.'; return; }
  if(!state.clubYear){ if(msg) msg.textContent='Activate a club year in Settings before creating meetings or events.'; return; }
  if(date<state.clubYear.start_date || date>state.clubYear.end_date){ if(msg) msg.textContent='The date must be inside the active club year.'; return; }
  if(type==='special' && state.user.role!=='director'){ if(msg) msg.textContent='Only the Director can create special events.'; return; }

  btn.disabled=true;
  const original=btn.textContent;
  btn.textContent='Saving…';
  if(msg) msg.textContent='';

  try{
    if(type==='regular'){
      const unitId=document.getElementById('newMeetingUnit')?.value || activeUnitId();
      if(!unitId) throw new Error('Choose a unit.');
      const existing=await sb(`meetings?unit_id=eq.${encodeURIComponent(unitId)}&meeting_date=eq.${encodeURIComponent(date)}&select=id,title&limit=1`,state.token);
      if(existing?.length) throw new Error('This unit already has a meeting or event on that date.');
      const rows=await sbWrite('meetings',state.token,{
        body:[{club_id:state.user.club_id,club_year_id:state.clubYear?.id||null,unit_id:unitId,meeting_date:date,title,meeting_type:'regular',unit_bonus_points:0,created_by:state.user.id}],
        prefer:'return=representation'
      });
      const created=rows?.[0];
      if(!created?.id) throw new Error('The meeting could not be created.');
      state.meetings=[created,...(state.meetings||[]).filter(m=>String(m.id)!==String(created.id))];
      state.selectedUnitId=unitId;
      state.unit=state.units.find(u=>String(u.id)===String(unitId))||state.unit;
      localStorage.setItem('pt_unit_id',unitId);
      closeMeetingCreator();
      await loadSelectedUnit(date);
      route='meeting';
      renderApp();
      return;
    }

    const awards=Array.from(document.querySelectorAll('[data-special-unit]')).map(input=>({
      unit_id:input.dataset.specialUnit,
      points:Math.max(0,Math.floor(Number(input.value||0)))
    })).filter(x=>x.points>0);
    if(!awards.length) throw new Error('Enter special points for at least one unit.');

    const unitIds=awards.map(x=>x.unit_id);
    const existing=await sb(`meetings?meeting_date=eq.${encodeURIComponent(date)}&unit_id=in.(${unitIds.join(',')})&select=id,unit_id,title`,state.token);
    if(existing?.length){
      const names=existing.map(m=>unitName(m.unit_id)).join(', ');
      throw new Error(`A meeting or event already exists on this date for: ${names}.`);
    }

    const payload=awards.map(x=>({
      club_id:state.user.club_id,
      club_year_id:state.clubYear?.id||null,
      unit_id:x.unit_id,
      meeting_date:date,
      title,
      meeting_type:'special',
      unit_bonus_points:x.points,
      created_by:state.user.id
    }));
    const created=await sbWrite('meetings',state.token,{body:payload,prefer:'return=representation'});
    state.meetings=[...(created||[]),...(state.meetings||[])];
    state.scoreboardLoaded=false;
    closeMeetingCreator();
    await loadScoreboardData(true);
    route='scoreboard';
    renderApp();
  }catch(err){
    console.error(err);
    if(msg){ msg.style.color='var(--red)'; msg.textContent=err.message||'Activity could not be created.'; }
  }finally{
    btn.disabled=false; btn.textContent=original;
  }
}

async function saveSpecialEvent(btn){
  if(state?.user?.role!=='director' || state?.meeting?.meeting_type!=='special' || !state.meeting.id) return;
  const title=(document.getElementById('specialEventTitle')?.value||state.meeting.title||'Special Event').trim();
  const points=Math.max(0,Math.floor(Number(document.getElementById('specialEventPoints')?.value||0)));
  const original=btn.textContent; btn.disabled=true; btn.textContent='Saving…';
  try{
    const rows=await sbWrite(`meetings?id=eq.${encodeURIComponent(state.meeting.id)}`,state.token,{
      method:'PATCH',body:{title,unit_bonus_points:points},prefer:'return=representation'
    });
    const updated=rows?.[0]||{...state.meeting,title,unit_bonus_points:points};
    state.meeting={...state.meeting,...updated};
    state.meetings=(state.meetings||[]).map(m=>String(m.id)===String(state.meeting.id)?{...m,...updated}:m);

    await loadScoreboardData(true);

  }catch(err){
    console.error(err); btn.disabled=false; btn.textContent=original;
    alert(err.message||'Special event could not be saved.');
  }
}

function bindProfileAvatarMenu(){
  const host=document.querySelector('[data-pt-profile]');
  if(!host)return;
  const trigger=host.querySelector('[data-profile-trigger]');
  const menu=host.querySelector('[data-profile-dropdown]');
  const close=()=>{menu.hidden=true;trigger.setAttribute('aria-expanded','false');};
  trigger.onclick=()=>{const next=menu.hidden;menu.hidden=!next;trigger.setAttribute('aria-expanded',String(next));};
  host.querySelector('[data-profile-logout]').onclick=signOut;
  // Abort all document listeners when the current screen is rerendered.
  if(window.ptProfileMenuAbort)window.ptProfileMenuAbort.abort();
  const controller=new AbortController();
  window.ptProfileMenuAbort=controller;
  document.addEventListener('click',event=>{if(!host.contains(event.target))close();},{signal:controller.signal});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'){close();trigger.focus();}},{signal:controller.signal});
}

function renderApp() {
  if(!state) return loginView();
  if(window.PTPortal?.isPortalRole()){
    route='dashboard';
    app.innerHTML=`<div class="app-layout">${window.PTPortal.nav()}<main class="main">${window.PTPortal.view()}</main></div>${window.PTPortal.mobileNav()}${quickSignOutButton()}${profileAvatarMenu()}`;
    window.PTPortal.bind();
    bindQuickSignOut();
    bindProfileAvatarMenu();
    return;
  }
  if(route==='meeting' && !canManageMeetings()) route='classes';
  app.innerHTML = `<div class="app-layout">${sidebar()}<main class="main">${route==='meeting'?meetingView():(route==='members'?membersView():(route==='classes'?classesView():(route==='units'?unitsView():(route==='scoreboard'?scoreboardView():(route==='staff'?staffView():(route==='reports'?reportsView():(route==='history'?historyView():(route==='settings'?settingsView():dashboardView()))))))))}</main></div>${bottomNav()}${quickSignOutButton()}${profileAvatarMenu()}`;
  bindNavigation();
  bindQuickSignOut();
  bindProfileAvatarMenu();
  const logout = document.getElementById('logoutBtn'); if(logout) logout.onclick = signOut;
  document.querySelectorAll('[data-viewer-logout]').forEach(btn=>btn.onclick=signOut);
  if(route==='staff' && window.PTAccessRequests)window.PTAccessRequests.bindDirector();
  ['unitSelect','unitSelectMobile'].forEach(id=>{ const unitSelect=document.getElementById(id); if(unitSelect) unitSelect.onchange=async (e)=>{ try { await changeUnit(e.target.value); } catch(err){ console.error(err); alert(translateUiString(err.message || 'Unit could not be loaded.')); renderApp(); } }; });

function bindNavigation(){
  document.querySelectorAll('[data-route]').forEach(el=>el.onclick=async()=>{
    route=el.dataset.route;
    if(state?.user?.role==='viewer' && route!=='dashboard')route='dashboard';
    renderApp();
    if(['dashboard','scoreboard','reports'].includes(route) && state?.mode==='live' && state?.user?.role==='director' && !state.scoreboardLoaded){
      try{ await loadScoreboardData(); renderApp(); }
      catch(err){ console.error(err); if(route==='scoreboard') alert(translateUiString(err.message||'Scoreboard could not be loaded.')); }
    }
    if(route==='history' && state?.mode==='live' && state?.user?.role==='director' && !state.auditLoaded){
      try{ await loadAuditData(); renderApp(); }
      catch(err){ console.error(err); alert(translateUiString(err.message||'History could not be loaded.')); }
    }
  });
}
function togglePresence(id){ const m=state.members.find(x=>String(x.id)===String(id)); m.present=!m.present; if(!m.present) Object.keys(m.scores||{}).forEach(k=>m.scores[k]=false); else scoreCategories.forEach(c=>m.scores[c.key]=true); renderApp(); }
function toggleScore(id,key){ const m=state.members.find(x=>String(x.id)===String(id)); if(!m.present) return; m.scores ||= {}; m.scores[key]=!m.scores[key]; renderApp(); }
async function deleteMeeting(btn){
  if(state?.mode==='demo' || state?.user?.role!=='director' || !state?.meeting?.id) return;
  const deletingSpecial=state.meeting?.meeting_type==='special';
  const meetingId=state.meeting.id;
  const meetingDate=state.meeting.rawDate || state.meeting.meeting_date || localISODate();
  const label=state.meeting.date || formatMeetingDate(meetingDate);
  const message=uiLanguage==='pt'
    ? `Apagar a reunião de ${label}? A presença e toda a pontuação desta reunião também serão apagadas. Esta ação não pode ser desfeita.`
    : uiLanguage==='es'
      ? `¿Eliminar la reunión del ${label}? La asistencia y toda la puntuación de esta reunión también se eliminarán. Esta acción no se puede deshacer.`
      : `Delete the meeting for ${label}? Attendance and all scoring for this meeting will also be deleted. This cannot be undone.`;
  if(!confirm(message)) return;

  const original=btn.textContent;
  btn.disabled=true;
  btn.textContent=uiLanguage==='pt'?'Apagando…':uiLanguage==='es'?'Eliminando…':'Deleting…';
  try{
    await sbWrite(`meetings?id=eq.${encodeURIComponent(meetingId)}`,state.token,{
      method:'DELETE',
      prefer:'return=representation'
    });

    // Remove it from the in-memory meeting list so loadSelectedUnit does not reload a deleted row.
    state.meetings=(state.meetings||[]).filter(m=>String(m.id)!==String(meetingId));
    state.scoreboardLoaded=false;
    await loadSelectedUnit(meetingDate);

    if(state.user.role==='director'){
      try{ await loadScoreboardData(); }catch(err){ console.error('Scoreboard refresh after meeting delete failed.',err); }
    }

    if(deletingSpecial){ route='dashboard'; await loadSelectedUnit(localISODate()); }
    renderApp();
    alert(deletingSpecial
      ? (uiLanguage==='pt'?'Evento apagado.':uiLanguage==='es'?'Evento eliminado.':'Event deleted.')
      : (uiLanguage==='pt'?'Reunião apagada.':uiLanguage==='es'?'Reunión eliminada.':'Meeting deleted.'));
  }catch(err){
    console.error(err);
    btn.disabled=false;
    btn.textContent=original;
    alert(err.message || (uiLanguage==='pt'?'A reunião não pôde ser apagada.':uiLanguage==='es'?'No se pudo eliminar la reunión.':'The meeting could not be deleted.'));
  }
}

async function saveMeeting(btn){
  if(state.mode==='demo') {
    btn.textContent='Demo saved ✓'; btn.disabled=true;
    setTimeout(()=>{btn.disabled=false;btn.textContent='Save meeting';},1400);
    return;
  }

  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Saving…';
  try {
    const unitId = activeUnitId();
    if(!state.clubYear) throw new Error('Activate a club year in Settings before recording a meeting.');
    if(!unitId) throw new Error('Choose a unit before recording a meeting.');
    if(!state.categories?.filter(c=>c.active!==false && !c.is_bonus).length) throw new Error('No active scoring criteria are configured for this club.');

    const meetingDate = state.meeting?.rawDate || localISODate();
    if(meetingDate<state.clubYear.start_date || meetingDate>state.clubYear.end_date) throw new Error('The meeting date is outside the active club year.');
    let meetingId = state.meeting?.id || null;

    if(!meetingId) {
      const payload = [{
        club_id: state.user.club_id,
        club_year_id: state.clubYear?.id || null,
        unit_id: unitId,
        meeting_date: meetingDate,
        title: state.meeting?.title || 'Club Meeting'
      }];
      const created = await sbWrite('meetings?on_conflict=unit_id,meeting_date', state.token, {
        body:payload,
        prefer:'resolution=merge-duplicates,return=representation'
      });
      meetingId = created?.[0]?.id;
      if(!meetingId) {
        const found = await sb(`meetings?unit_id=eq.${encodeURIComponent(unitId)}&meeting_date=eq.${encodeURIComponent(meetingDate)}&select=id,meeting_date,title,unit_id,club_year_id,meeting_type,unit_bonus_points&limit=1`, state.token);
        meetingId = found?.[0]?.id;
      }
      if(!meetingId) throw new Error('The meeting could not be created.');
      state.meeting = {...state.meeting,id:meetingId,unit_id:unitId,meeting_date:meetingDate,rawDate:meetingDate,date:formatMeetingDate(meetingDate)};
    }

    const attendanceRows = state.members.map(m=>({
      meeting_id:meetingId,
      member_id:m.id,
      present:!!m.present,
      recorded_at:new Date().toISOString()
    }));
    await sbWrite('attendance?on_conflict=meeting_id,member_id', state.token, {
      body:attendanceRows,
      prefer:'resolution=merge-duplicates,return=minimal'
    });

    const dbCategories = state.categories.filter(c=>c.active!==false && !c.is_bonus);
    const scoreRows = [];
    for(const m of state.members) {
      for(const c of dbCategories) {
        scoreRows.push({
          meeting_id:meetingId,
          member_id:m.id,
          category_id:c.id,
          max_points_snapshot:c.default_points,
          points_awarded:m.present && m.scores?.[c.id] ? c.default_points : 0,
          recorded_at:new Date().toISOString()
        });
      }
    }
    await sbWrite('meeting_scores?on_conflict=meeting_id,member_id,category_id', state.token, {
      body:scoreRows,
      prefer:'resolution=merge-duplicates,return=minimal'
    });

    state.scoreboardLoaded=false;
    btn.textContent='Saved ✓';
    setTimeout(()=>{btn.disabled=false;btn.textContent=original;},1600);
  } catch(err) {
    console.error(err);
    btn.textContent='Save failed — retry';
    btn.disabled=false;
    alert(translateUiString(err.message || 'The meeting could not be saved.'));
  }
}
function signOut(){
  clearAuthSession();
  scoreCategories=structuredClone(defaultScoreCategories);
  state=null; route='dashboard'; selectedClassId=null; selectedClassMemberId=null;
  loginView();
}

(async function boot(){
  startUiLanguageObserver();
  const inviteSession=inviteSessionFromHash();
  if(inviteSession?.error){
    app.innerHTML=`<div class="loading">Invitation error: ${esc(inviteSession.error)}</div>`;
    return;
  }
  if(inviteSession?.accessToken){ passwordSetupView(inviteSession.accessToken,inviteSession.type,inviteSession.refreshToken,inviteSession.expiresIn,inviteSession.expiresAt); return; }
  const params = new URLSearchParams(location.search);
  if(params.get('demo') === '1') {
    state = structuredClone(demoState);
    route = ['meeting','members','classes'].includes(params.get('view')) ? params.get('view') : 'dashboard';
    renderApp();
  } else {
    const storedSession=readAuthSession();
    if(storedSession?.access_token){
      app.innerHTML='<div class="loading">Loading Pathfinder Track…</div>';
      try{
        scheduleAuthRefresh(storedSession);
        const token=await getValidAccessToken(storedSession.access_token,false);
        await loadAuthenticatedState(token);
        renderApp();
      }catch(err){
        console.warn('Stored session could not be restored.',err);
        clearAuthSession();
        loginView();
      }
    }else loginView();
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible' && state?.mode==='live' && readAuthSession()?.refresh_token){
      getValidAccessToken(null,false).catch(err=>console.warn('Session check failed.',err));
    }
  });
  window.addEventListener('online',()=>{
    if(state?.mode==='live' && readAuthSession()?.refresh_token){
      getValidAccessToken(null,false).catch(err=>console.warn('Session check failed.',err));
    }
  });

})();
